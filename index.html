<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palinsesto Calcio & Statistiche</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #1c1c1e;
      --primary: #007aff;
      --primary-hover: #0056b3;
      --success: #34c759;
      --border-color: #e5e5ea;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button.btn-validate {
      background-color: var(--success);
    }

    .status-panel {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .matches-grid {
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      }
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge-league {
      background: #eef2ff;
      color: #3b82f6;
      font-weight: 600;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .match-time {
      font-size: 12px;
      color: #8e8e93;
    }

    .teams-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .team-names {
      font-size: 15px;
      line-height: 1.3;
    }

    .score-badge {
      background: #f2f2f7;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      min-width: 70px;
      text-align: center;
    }

    .score-badge.finished {
      background: #e2f8e9;
      color: #1b7a36;
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .stats-table th, .stats-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #f2f2f7;
      text-align: center;
    }

    .stats-table td.label {
      text-align: left;
      color: #636366;
    }

    .form-symbols {
      display: block;
      font-size: 10px;
      margin-top: 2px;
    }

    .top-scorer-box {
      background: #f9f9fb;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #3a3a3c;
      line-height: 1.4;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 16px;
      color: #8e8e93;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚽ Palinsesto Calcio</h1>

    <div class="actions">
      <button onclick="caricaDati(false)">🔄 Aggiorna Vista</button>
      <button onclick="caricaDati(true)">⚡ Forzatura Nuovo Palinsesto</button>
      <button class="btn-validate" onclick="validaRisultati()">✅ Valida Risultati</button>
    </div>

    <div id="statusPanel" class="status-panel">Caricamento stato...</div>

    <div id="listaPartite" class="matches-grid">
      <div class="loading">Caricamento partite in corso...</div>
    </div>
  </div>

  <script>
    // ⚠️ SOSTITUISCI QUESTO URL CON L'INDIRIZZO DEL TUO WORKER CLOUDFLARE
    const WORKER_URL = "https://tuo-worker.workers.dev";

    const statusPanel = document.getElementById('statusPanel');
    const listaPartite = document.getElementById('listaPartite');

    async function caricaDati(force = false) {
      listaPartite.innerHTML = `<div class="loading">${force ? 'Generazione nuovo palinsesto...' : 'Caricamento...'}</div>`;
      
      try {
        const url = force ? `${WORKER_URL}?force=true` : WORKER_URL;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.errore) {
          throw new Error(data.messaggio || "Errore sconosciuto");
        }
        
        mostraDati(data);
      } catch (err) {
        listaPartite.innerHTML = `<div class="loading" style="color: #ff3b30;">❌ Errore durante il caricamento: ${err.message}</div>`;
      }
    }

    async function validaRisultati() {
      listaPartite.innerHTML = `<div class="loading">Validazione risultati in corso...</div>`;
      try {
        const res = await fetch(`${WORKER_URL}?validate=true`);
        const data = await res.json();
        
        if (data.errore) {
          throw new Error(data.messaggio || "Errore durante la validazione");
        }
        
        mostraDati(data);
      } catch (err) {
        listaPartite.innerHTML = `<div class="loading" style="color: #ff3b30;">❌ Errore durante la validazione: ${err.message}</div>`;
      }
    }

    function mostraDati(data) {
      const dataAgg = data.dataAggiornamento ? new Date(data.dataAggiornamento).toLocaleString('it-IT') : 'N/D';
      const dataVal = data.dataUltimaValidazione ? new Date(data.dataUltimaValidazione).toLocaleString('it-IT') : 'Mai effettuata';

      statusPanel.innerHTML = `
        <strong>Partite:</strong> ${data.totalePartiteTrovate || 0} | 
        <strong>Aggiornato:</strong> ${dataAgg}<br>
        <strong>Ultima Validazione:</strong> ${dataVal}
      `;

      if (!data.partite || data.partite.length === 0) {
        listaPartite.innerHTML = "<p style='grid-column: 1/-1; text-align:center; padding: 20px;'>Nessuna partita presente nel palinsesto.</p>";
        return;
      }

      listaPartite.innerHTML = data.partite.map(p => {
        const dataOra = p.dataOraUTC ? new Date(p.dataOraUTC).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : 'N/D';
        
        // Nomi sicuri per prevenire l'errore .substring() su valori null o undefined
        const nomeCasa = p.squadraCasa || 'Casa';
        const nomeOspite = p.squadraOspite || 'Ospite';

        return `
          <div class="match-card">
            <div class="match-header">
              <span class="badge-league">${p.campionato || p.codiceCampionato}</span>
              <span class="match-time">📅 ${dataOra}</span>
            </div>

            <div class="teams-container">
              <div class="team-names">
                <b>${nomeCasa}</b> <span style="font-weight: normal; color: #8e8e93;">vs</span> <b>${nomeOspite}</b>
              </div>
              <div class="score-badge ${p.completata ? 'finished' : ''}">
                ${p.risultatoFinale || 'In attesa'}
              </div>
            </div>

            <table class="stats-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Dato</th>
                  <th>${nomeCasa.substring(0, 10)}</th>
                  <th>${nomeOspite.substring(0, 10)}</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="label">Punti / Posizione</td>
                  <td><b>${p.puntiCasa ?? '-'}</b> (${p.posizioneCasa ?? '-'})</td>
                  <td><b>${p.puntiOspite ?? '-'}</b> (${p.posizioneOspite ?? '-'})</td>
                </tr>
                <tr>
                  <td class="label">Partite Giocate</td>
                  <td>${p.giocateCasa ?? '-'}</td>
                  <td>${p.giocateOspite ?? '-'}</td>
                </tr>
                <tr>
                  <td class="label">V / P / S Generali</td>
                  <td>${p.vinteCasa ?? '-'}/${p.pareggiateCasa ?? '-'}/${p.perseCasa ?? '-'}</td>
                  <td>${p.vinteOspite ?? '-'}/${p.pareggiateOspite ?? '-'}/${p.perseOspite ?? '-'}</td>
                </tr>
                <tr>
                  <td class="label">Gol Fatti / Subiti</td>
                  <td>${p.golFattiCasa ?? '-'} / ${p.golSubitiCasa ?? '-'}</td>
                  <td>${p.golFattiOspite ?? '-'} / ${p.golSubitiOspite ?? '-'}</td>
                </tr>
                <tr>
                  <td class="label">Punti (Casa / Trasf.)</td>
                  <td>${p.puntiCasaSoloCasa ?? 0} (Casa)</td>
                  <td>${p.puntiOspiteSoloTrasferta ?? 0} (Trasf.)</td>
                </tr>
                <tr>
                  <td class="label">V/P/S (Casa / Trasf.)</td>
                  <td>${p.vpsCasaSoloCasa || '0/0/0'}</td>
                  <td>${p.vpsOspiteSoloTrasferta || '0/0/0'}</td>
                </tr>
                <tr>
                  <td class="label">Indice Forma</td>
                  <td>
                    <span>${p.indiceFormaCasa || '-'}</span>
                    <span class="form-symbols">${p.simboliFormaCasa || ''}</span>
                  </td>
                  <td>
                    <span>${p.indiceFormaOspite || '-'}</span>
                    <span class="form-symbols">${p.simboliFormaOspite || ''}</span>
                  </td>
                </tr>
              </tbody>
            </table>

            <div class="top-scorer-box">
              🎯 <b>Top Scorer:</b><br>
              • ${nomeCasa}: ${p.topScorerCasa || 'N/D'}<br>
              • ${nomeOspite}: ${p.topScorerOspite || 'N/D'}
            </div>
          </div>
        `;
      }).join('');
    }

    // Caricamento iniziale
    caricaDati();
  </script>
</body>
</html>
