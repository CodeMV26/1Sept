<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Palinsesto Calcio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 950: '#030712' }
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- HEADER / CONTROL PANEL -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">Palinsesto Calcistico</h1>
                    <p class="text-xs text-slate-400">Analisi quote, dati e metriche avanzate</p>
                </div>

                <!-- CONTROLLI ESECUZIONE -->
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                        <label for="inputDataInizio" class="text-xs text-slate-300 font-medium">Inizio:</label>
                        <input type="date" id="inputDataInizio" class="bg-slate-900 text-xs text-white px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div class="flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                        <label for="inputOffsetGiorni" class="text-xs text-slate-300 font-medium">+Giorni:</label>
                        <input type="number" id="inputOffsetGiorni" value="14" min="1" max="30" class="w-14 bg-slate-900 text-xs text-white px-2 py-1 rounded border border-slate-700 focus:outline-none focus:border-indigo-500 text-center">
                    </div>

                    <button id="btnEstrai" onclick="estraiEdAggiorna()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                        <span id="labelEstrai">Estrai Dati</span>
                        <div id="spinnerEstrai" class="hidden w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    </button>
                </div>
            </div>

            <!-- FILTRI CAMPIONATI (CHECKBOXES) -->
            <div class="mt-4 pt-3 border-t border-slate-800/60">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Filtra Campionati:</span>
                    <div class="space-x-2 text-[11px]">
                        <button onclick="selezionaTuttiCampionati(true)" class="text-indigo-400 hover:underline">Seleziona Tutti</button>
                        <span class="text-slate-600">|</span>
                        <button onclick="selezionaTuttiCampionati(false)" class="text-slate-400 hover:underline">Deseleziona Tutti</button>
                    </div>
                </div>
                <div id="containerCampionati" class="flex flex-wrap gap-2 text-xs">
                    <!-- Dinamico tramite JS -->
                </div>
            </div>
        </div>
    </header>

    <!-- CONTAINER PARTITE -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Partite In programma</h2>
            <span id="badgeTotalePartite" class="bg-slate-800 text-indigo-400 text-xs font-bold px-2.5 py-1 rounded-full border border-slate-700">0 Match</span>
        </div>

        <div id="gridPartite" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Cards caricate da Firestore -->
        </div>
    </main>

    <script>
        // Configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey_ReplaceIfRequired",
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-app-id",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const WORKER_URL = "https://tuo-worker.workers.dev"; // Sostituire con l'URL reale del Worker
        const LISTA_CAMPIONATI = [
            { code: "SA", name: "Serie A" },
            { code: "PL", name: "Premier League" },
            { code: "PD", name: "La Liga" },
            { code: "BL1", name: "Bundesliga" },
            { code: "FL1", name: "Ligue 1" },
            { code: "BSA", name: "Brasileirao" },
            { code: "DED", name: "Eredivisie" },
            { code: "PPL", name: "Primeira Liga" },
            { code: "ELC", name: "Championship" },
            { code: "CL", name: "Champions League" },
            { code: "EC", name: "Europei" },
            { code: "WC", name: "Mondiali" }
        ];

        let cachePartiteFirestore = [];

        // Inizializzazione pagina
        document.addEventListener("DOMContentLoaded", () => {
            const oggi = new Date().toISOString().split('T')[0];
            document.getElementById("inputDataInizio").value = oggi;
            
            renderizzaFiltriCampionati();
            ascoltaPalinsestoFirestore();
        });

        function renderizzaFiltriCampionati() {
            const container = document.getElementById("containerCampionati");
            container.innerHTML = LISTA_CAMPIONATI.map(c => `
                <label class="inline-flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded cursor-pointer hover:border-slate-700 transition-colors">
                    <input type="checkbox" value="${c.code}" checked onchange="applicaFiltri()" class="chkCampionato rounded text-indigo-600 focus:ring-0 bg-slate-950 border-slate-700">
                    <span class="text-slate-300">${c.name}</span>
                </label>
            `).join('');
        }

        function selezionaTuttiCampionati(stato) {
            document.querySelectorAll('.chkCampionato').forEach(chk => chk.checked = stato);
            applicaFiltri();
        }

        function ascoltaPalinsestoFirestore() {
            db.collection("palinsesto").doc("corrente").onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    cachePartiteFirestore = data.partite || [];
                    applicaFiltri();
                }
            });
        }

        async function estraiEdAggiorna() {
            const btn = document.getElementById("btnEstrai");
            const label = document.getElementById("labelEstrai");
            const spinner = document.getElementById("spinnerEstrai");

            const dataInizio = document.getElementById("inputDataInizio").value;
            const offset = parseInt(document.getElementById("inputOffsetGiorni").value) || 14;
            
            const dFine = new Date(dataInizio);
            dFine.setDate(dFine.getDate() + offset);
            const dataFine = dFine.toISOString().split('T')[0];

            const compSelezionati = Array.from(document.querySelectorAll('.chkCampionato:checked')).map(cb => cb.value).join(',');

            btn.disabled = true;
            label.innerText = "Estrazione in corso...";
            spinner.classList.remove("hidden");

            try {
                const res = await fetch(`${WORKER_URL}?dateFrom=${dataInizio}&dateTo=${dataFine}&competitions=${compSelezionati}`);
                const data = await res.json();

                if (data && data.partite) {
                    await db.collection("palinsesto").doc("corrente").set({
                        aggiornatoIl: new Date().toISOString(),
                        totalePartiteTrovate: data.totalePartiteTrovate,
                        partite: data.partite
                    });
                }
            } catch (err) {
                console.error("Errore nell'estrazione:", err);
                alert("Si è verificato un errore durante l'estrazione dei dati.");
            } finally {
                btn.disabled = false;
                label.innerText = "Estrai Dati";
                spinner.classList.add("hidden");
            }
        }

        function applicaFiltri() {
            const campionatiAttivi = Array.from(document.querySelectorAll('.chkCampionato:checked')).map(cb => cb.value);
            
            const partiteFiltrate = cachePartiteFirestore.filter(p => 
                campionatiAttivi.includes(p.campionatoCode)
            );

            document.getElementById("badgeTotalePartite").innerText = `${partiteFiltrate.length} Match`;
            renderizzaCards(partiteFiltrate);
        }

        function generaBadgeForma(formaStr) {
            if (!formaStr) return '<span class="text-slate-600">-</span>';
            const charArray = formaStr.toUpperCase().split('').slice(-5);
            return charArray.map(c => {
                if (c === 'W') return `<span class="inline-block w-4 h-4 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[9px] font-bold text-center leading-4">V</span>`;
                if (c === 'D') return `<span class="inline-block w-4 h-4 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[9px] font-bold text-center leading-4">P</span>`;
                if (c === 'L') return `<span class="inline-block w-4 h-4 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[9px] font-bold text-center leading-4">S</span>`;
                return '';
            }).join(' ');
        }

        function renderizzaCards(partite) {
            const grid = document.getElementById("gridPartite");
            grid.innerHTML = "";

            if (partite.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">Nessuna partita trovata per i filtri selezionati.</div>`;
                return;
            }

            partite.forEach(p => {
                // Formatting e Fallback Metriche Medie
                const mediaPuntiC = p.mediaPuntiCasa || (p.giocateCasa ? (p.puntiCasa / p.giocateCasa).toFixed(2) : "0.00");
                const mediaPuntiO = p.mediaPuntiOspite || (p.giocateOspite ? (p.puntiOspite / p.giocateOspite).toFixed(2) : "0.00");

                const mediaGolFattiC = p.mediaGolFattiCasa || (p.giocateCasa ? (p.golFattiCasa / p.giocateCasa).toFixed(2) : "0.00");
                const mediaGolFattiO = p.mediaGolFattiOspite || (p.giocateOspite ? (p.golFattiOspite / p.giocateOspite).toFixed(2) : "0.00");

                const mediaGolSubitiC = p.mediaGolSubitiCasa || (p.giocateCasa ? (p.golSubitiCasa / p.giocateCasa).toFixed(2) : "0.00");
                const mediaGolSubitiO = p.mediaGolSubitiOspite || (p.giocateOspite ? (p.golSubitiOspite / p.giocateOspite).toFixed(2) : "0.00");

                const golAttesiVal = p.indiceGolAttesi || (parseFloat(mediaGolFattiC) + parseFloat(mediaGolFattiO)).toFixed(2);

                // Formatting e Fallback Top Scorer / Top Assistman
                const scorerCasaDisplay = (p.topScorerCasa && p.topScorerCasa !== "N.D.") ? p.topScorerCasa : "Non disponibile";
                const scorerOspiteDisplay = (p.topScorerOspite && p.topScorerOspite !== "N.D.") ? p.topScorerOspite : "Non disponibile";
                const assistCasaDisplay = (p.topAssistCasa && p.topAssistCasa !== "N.D.") ? p.topAssistCasa : "Dato non tracciato";
                const assistOspiteDisplay = (p.topAssistOspite && p.topAssistOspite !== "N.D.") ? p.topAssistOspite : "Dato non tracciato";

                const diffCasa = (p.diffRetiCasa > 0 ? `+${p.diffRetiCasa}` : p.diffRetiCasa);
                const diffOspite = (p.diffRetiOspite > 0 ? `+${p.diffRetiOspite}` : p.diffRetiOspite);

                const dataFormatted = new Date(p.dataOraUTC || p.utcDate).toLocaleString('it-IT', {
                    day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                });

                const cardHtml = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between hover:border-slate-700 transition-all shadow-md">
                        <!-- HEADER CARD -->
                        <div>
                            <div class="flex justify-between items-center text-[10px] text-slate-400 border-b border-slate-800 pb-2 mb-3">
                                <span class="font-bold text-indigo-400 uppercase tracking-wider">${p.campionato}</span>
                                <span>${dataFormatted}</span>
                            </div>

                            <!-- SQUADRE E RISULTATO -->
                            <div class="grid grid-cols-7 items-center mb-3">
                                <div class="col-span-3 text-left">
                                    <div class="font-bold text-sm text-white truncate" title="${p.squadraCasa}">${p.squadraCasa}</div>
                                    <div class="text-[10px] text-slate-400 mt-0.5">Pos: <span class="text-slate-200 font-semibold">${p.posizioneCasa}°</span> (${p.puntiCasa} pt)</div>
                                </div>
                                <div class="col-span-1 text-center">
                                    ${p.risultatoReale ? `<span class="bg-indigo-600 text-white font-extrabold text-xs px-2 py-0.5 rounded">${p.risultatoReale}</span>` : `<span class="text-xs font-bold text-slate-600">VS</span>`}
                                </div>
                                <div class="col-span-3 text-right">
                                    <div class="font-bold text-sm text-white truncate" title="${p.squadraOspite}">${p.squadraOspite}</div>
                                    <div class="text-[10px] text-slate-400 mt-0.5">Pos: <span class="text-slate-200 font-semibold">${p.posizioneOspite}°</span> (${p.puntiOspite} pt)</div>
                                </div>
                            </div>

                            <!-- CLASSIFICA DETTAGLIATA (TOTALE E CASA/TRASFERTA) -->
                            <div class="bg-slate-950/40 rounded-xl p-2.5 border border-slate-800/60 mb-3 space-y-2 text-[11px]">
                                <div class="flex justify-between items-center">
                                    <div class="text-slate-400">Totale (V/P/S):</div>
                                    <div class="font-semibold text-slate-200">${p.vinteCasa}-${p.pareggiateCasa}-${p.persoCasa} <span class="text-slate-500">vs</span> ${p.vinteOspite}-${p.pareggiateOspite}-${p.persoOspite}</div>
                                </div>
                                <div class="flex justify-between items-center">
                                    <div class="text-slate-400">Casa/Trasferta:</div>
                                    <div class="font-semibold text-slate-200">${p.vinteCasaInCasa}-${p.pareggiateCasaInCasa}-${p.persoCasaInCasa} <span class="text-slate-500">vs</span> ${p.vinteOspiteInTrasferta}-${p.pareggiateOspiteInTrasferta}-${p.persoOspiteInTrasferta}</div>
                                </div>
                                <div class="flex justify-between items-center border-t border-slate-800/50 pt-1.5">
                                    <div class="text-slate-400">Diff. Reti:</div>
                                    <div class="font-semibold text-slate-200">${diffCasa} <span class="text-slate-500">vs</span> ${diffOspite}</div>
                                </div>
                            </div>

                            <!-- FORMA DISSOCIATA -->
                            <div class="flex justify-between items-center px-1 mb-3">
                                <div class="flex gap-0.5 items-center">${generaBadgeForma(p.formaCasa)}</div>
                                <span class="text-[9px] text-slate-500 uppercase font-bold">Forma</span>
                                <div class="flex gap-0.5 items-center">${generaBadgeForma(p.formaOspite)}</div>
                            </div>

                            <!-- TOP SCORERS & TOP ASSISTS -->
                            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 my-2 space-y-2 text-xs">
                                <div class="flex justify-between items-start gap-2">
                                    <div class="truncate w-1/2">
                                        <span class="text-[9px] text-slate-400 block uppercase font-bold tracking-wider">Top Scorer Casa</span>
                                        <span class="text-emerald-400 font-bold truncate block text-xs mt-0.5" title="${scorerCasaDisplay}">${scorerCasaDisplay}</span>
                                    </div>
                                    <div class="text-right truncate w-1/2">
                                        <span class="text-[9px] text-slate-400 block uppercase font-bold tracking-wider">Top Scorer Ospite</span>
                                        <span class="text-emerald-400 font-bold truncate block text-xs mt-0.5" title="${scorerOspiteDisplay}">${scorerOspiteDisplay}</span>
                                    </div>
                                </div>
                                <div class="flex justify-between items-start gap-2 border-t border-slate-800/60 pt-2">
                                    <div class="truncate w-1/2">
                                        <span class="text-[9px] text-slate-400 block uppercase font-bold tracking-wider">Top Assistman Casa</span>
                                        <span class="text-blue-400 font-bold truncate block text-xs mt-0.5" title="${assistCasaDisplay}">${assistCasaDisplay}</span>
                                    </div>
                                    <div class="text-right truncate w-1/2">
                                        <span class="text-[9px] text-slate-400 block uppercase font-bold tracking-wider">Top Assistman Ospite</span>
                                        <span class="text-blue-400 font-bold truncate block text-xs mt-0.5" title="${assistOspiteDisplay}">${assistOspiteDisplay}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- METRICHE MEDIE (GRIGLIA METRICHE SINTETICHE) -->
                            <div class="grid grid-cols-4 gap-1.5 my-3 text-center">
                                <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                    <div class="text-[8px] text-slate-400 uppercase font-bold truncate">Media Punti</div>
                                    <div class="text-xs font-extrabold text-emerald-400 mt-1">${mediaPuntiC} | ${mediaPuntiO}</div>
                                </div>
                                <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                    <div class="text-[8px] text-slate-400 uppercase font-bold truncate">Media Gol Fatti</div>
                                    <div class="text-xs font-extrabold text-blue-400 mt-1">${mediaGolFattiC} | ${mediaGolFattiO}</div>
                                </div>
                                <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                    <div class="text-[8px] text-slate-400 uppercase font-bold truncate">Media Gol Subiti</div>
                                    <div class="text-xs font-extrabold text-rose-400 mt-1">${mediaGolSubitiC} | ${mediaGolSubitiO}</div>
                                </div>
                                <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                    <div class="text-[8px] text-slate-400 uppercase font-bold truncate">Gol Attesi</div>
                                    <div class="text-xs font-extrabold text-indigo-300 mt-1">${golAttesiVal}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }
    </script>
</body>
</html>
