<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased pb-28">

    <!-- HEADER -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                <h1 class="text-lg font-bold text-white">SoccerStats ML Engine</h1>
            </div>
            <div id="syncBadge" class="px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Sync
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 my-2">
        <section class="space-y-6">
            <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-3xl shadow-2xl backdrop-blur-xl max-w-2xl mx-auto">
                <h2 class="text-xs font-bold tracking-widest text-blue-400 uppercase mb-3">
                    PANNELLO CONTROL ENGINE &amp; ESTRAZIONE
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Inizio</label>
                        <input type="date" id="dateFrom" onchange="ricalcolaDataFine()" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Giorni</label>
                        <input type="number" id="daysOffset" value="14" min="1" max="30" onchange="ricalcolaDataFine()" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Fine</label>
                        <input type="date" id="dateTo" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- CHECKBOX CAMPIONATI -->
                <div class="mb-5 bg-slate-950/80 p-4 rounded-2xl border border-slate-800">
                    <div class="flex justify-between items-center mb-2.5">
                        <label class="text-[11px] font-bold text-slate-300 uppercase">Campionati da Estrarre</label>
                        <button type="button" onclick="toggleTuttiCampionati()" class="text-[10px] text-blue-400 hover:text-blue-300 font-semibold underline">Seleziona/Deseleziona Tutti</button>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800 cursor-pointer"><input type="checkbox" class="comp-checkbox" value="SA" checked><span>Serie A</span></label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800 cursor-pointer"><input type="checkbox" class="comp-checkbox" value="PL" checked><span>Premier League</span></label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800 cursor-pointer"><input type="checkbox" class="comp-checkbox" value="PD" checked><span>La Liga</span></label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800 cursor-pointer"><input type="checkbox" class="comp-checkbox" value="BL1" checked><span>Bundesliga</span></label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800 cursor-pointer"><input type="checkbox" class="comp-checkbox" value="FL1" checked><span>Ligue 1</span></label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800 cursor-pointer"><input type="checkbox" class="comp-checkbox" value="CL" checked><span>Champions League</span></label>
                    </div>
                </div>

                <button id="btnEstrai" type="button" onclick="sincronizzaESalva(event)" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition text-sm cursor-pointer">
                    Estrai &amp; Calcola Parametri Avanzati
                </button>

                <div id="stato" class="hidden mt-4 p-3 rounded-xl text-xs text-center border"></div>
            </div>

            <div id="risultati" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mt-6"></div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvZ6My0UlFyzAIMvKvWdNneQPajryjvsw",
            authDomain: "betting-pro-db.firebaseapp.com",
            projectId: "betting-pro-db",
            storageBucket: "betting-pro-db.firebasestorage.app",
            messagingSenderId: "157886609369",
            appId: "1:157886609369:web:565f3a44ec8d1dba3c8bc8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const WORKER_URL = "https://betting-pro-api.mvmymail.workers.dev/";

        function formattaDataIso(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function ricalcolaDataFine() {
            const valFrom = document.getElementById("dateFrom").value;
            const daysOffset = parseInt(document.getElementById("daysOffset").value) || 14;
            if (valFrom) {
                const parts = valFrom.split("-");
                const dInizio = new Date(parts[0], parts[1] - 1, parts[2]);
                dInizio.setDate(dInizio.getDate() + daysOffset);
                document.getElementById("dateTo").value = formattaDataIso(dInizio);
            }
        }

        window.onload = function() {
            document.getElementById("dateFrom").value = formattaDataIso(new Date());
            ricalcolaDataFine();

            db.collection("palinsesto").doc("corrente").onSnapshot((doc) => {
                if (doc.exists && doc.data().partite) {
                    mostraPartite(doc.data().partite);
                }
            });
        };

        function toggleTuttiCampionati() {
            const checkboxes = document.querySelectorAll('.comp-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        // CALCOLO PARAMETRI LATO CLIENT (SICUREZZA 100% SUI DECIMALI)
        function calcolaParametriMatch(p) {
            const gCasa = p.giocateCasa || 0;
            const gOspite = p.giocateOspite || 0;

            const mPuntiCasa = gCasa > 0 ? (p.puntiCasa / gCasa).toFixed(2) : "0.00";
            const mPuntiOspite = gOspite > 0 ? (p.puntiOspite / gOspite).toFixed(2) : "0.00";

            const mGFCasa = gCasa > 0 ? (p.golFattiCasa / gCasa).toFixed(2) : "0.00";
            const mGSCasa = gCasa > 0 ? (p.golSubitiCasa / gCasa).toFixed(2) : "0.00";

            const mGFOspite = gOspite > 0 ? (p.golFattiOspite / gOspite).toFixed(2) : "0.00";
            const mGSOspite = gOspite > 0 ? (p.golSubitiOspite / gOspite).toFixed(2) : "0.00";

            // Algoritmo Gol Attesi (xG) basato sulle medie incrociate Casa/Trasferta
            const expGolCasa = (parseFloat(mGFCasa) + parseFloat(mGSOspite)) / 2;
            const expGolOspite = (parseFloat(mGFOspite) + parseFloat(mGSCasa)) / 2;
            const golAttesi = (expGolCasa + expGolOspite).toFixed(2);

            return {
                mPuntiCasa, mPuntiOspite,
                mGFCasa, mGSCasa,
                mGFOspite, mGSOspite,
                golAttesi: isNaN(golAttesi) ? "0.00" : golAttesi
            };
        }

        function mostraPartite(partite) {
            const risultati = document.getElementById("risultati");
            risultati.innerHTML = "";

            partite.forEach(p => {
                const calc = calcolaParametriMatch(p);

                const card = document.createElement("div");
                card.className = "bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4";
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-2">
                        <span class="font-bold text-slate-200">${p.campionato}</span>
                        <span>${new Date(p.utcDate || p.dataOraUTC).toLocaleString('it-IT', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})}</span>
                    </div>

                    <div class="flex justify-between items-center text-base font-bold text-white">
                        <span>${p.squadraCasa}</span>
                        <span class="text-xs px-2 py-1 bg-slate-950 border border-slate-800 rounded-lg text-emerald-400">${p.risultatoReale || 'VS'}</span>
                        <span>${p.squadraOspite}</span>
                    </div>

                    <!-- TOP SCORERS / ASSIST -->
                    <div class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-xs space-y-1">
                        <div class="flex justify-between">
                            <span class="text-slate-400">Top Scorer Casa: <b class="text-emerald-400">${p.topScorerCasa || 'N.D.'}</b></span>
                            <span class="text-slate-400">Top Scorer Ospite: <b class="text-emerald-400">${p.topScorerOspite || 'N.D.'}</b></span>
                        </div>
                        <div class="flex justify-between border-t border-slate-800/40 pt-1">
                            <span class="text-slate-400">Top Assist Casa: <b class="text-blue-400">${p.topAssistmanCasa || p.topAssistCasa || 'N.D.'}</b></span>
                            <span class="text-slate-400">Top Assist Ospite: <b class="text-blue-400">${p.topAssistmanOspite || p.topAssistOspite || 'N.D.'}</b></span>
                        </div>
                    </div>

                    <!-- METRICHE CALCOLATE -->
                    <div class="grid grid-cols-4 gap-2 text-center">
                        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <div class="text-[9px] text-slate-400 uppercase font-semibold">Media Punti</div>
                            <div class="text-xs font-bold text-emerald-400 mt-1">${calc.mPuntiCasa} | ${calc.mPuntiOspite}</div>
                        </div>
                        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <div class="text-[9px] text-slate-400 uppercase font-semibold">Gol Fatti</div>
                            <div class="text-xs font-bold text-blue-400 mt-1">${calc.mGFCasa} | ${calc.mGFOspite}</div>
                        </div>
                        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <div class="text-[9px] text-slate-400 uppercase font-semibold">Gol Subiti</div>
                            <div class="text-xs font-bold text-rose-400 mt-1">${calc.mGSCasa} | ${calc.mGSOspite}</div>
                        </div>
                        <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <div class="text-[9px] text-slate-400 uppercase font-semibold">Gol Attesi</div>
                            <div class="text-xs font-bold text-indigo-300 mt-1">${calc.golAttesi}</div>
                        </div>
                    </div>
                `;
                risultati.appendChild(card);
            });
        }

        function mostraStato(m, t) {
            const s = document.getElementById("stato");
            s.classList.remove("hidden");
            s.innerText = m;
        }

        async function sincronizzaESalva(e) {
            if (e) e.preventDefault();
            const btn = document.getElementById("btnEstrai");
            const dateFrom = document.getElementById("dateFrom").value;
            const dateTo = document.getElementById("dateTo").value;
            const selectedCheckboxes = document.querySelectorAll('.comp-checkbox:checked');
            const selectedComps = Array.from(selectedCheckboxes).map(cb => cb.value.trim());

            btn.disabled = true;
            btn.textContent = "Elaborazione in corso...";
            mostraStato("Estrazione dati dalle API ed elaborazione parametri...", "info");

            try {
                const fullUrl = `${WORKER_URL}?dateFrom=${dateFrom}&dateTo=${dateTo}&competitions=${encodeURIComponent(selectedComps.join(","))}`;
                const res = await fetch(fullUrl);
                const data = await res.json();

                if (data.partite) {
                    await db.collection("palinsesto").doc("corrente").set({
                        partite: data.partite,
                        ultimoAggiornamento: new Date().toLocaleString("it-IT")
                    });
                    mostraStato(`Estrazione completata per ${data.partite.length} partite!`, "success");
                }
            } catch (err) {
                mostraStato("Errore nell'estrazione: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Estrai & Calcola Parametri Avanzati";
            }
        }
    </script>
</body>
</html>
