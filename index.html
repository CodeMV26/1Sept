<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Betting Pro Mobile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 16px;
            color: #1d1d1f;
        }
        .brand { text-align: center; margin-bottom: 16px; }
        .brand h1 { color: #0071e3; font-size: 20px; margin: 0; }
        .brand .versione { font-size: 11px; color: #86868b; margin-top: 2px; }
        button#btnEstrai {
            width: 100%;
            padding: 14px;
            background-color: #2cd158;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            cursor: pointer;
        }
        button#btnEstrai:disabled { background-color: #a5e8bb; cursor: not-allowed; }
        #stato { text-align: center; font-size: 13px; color: #86868b; margin-bottom: 12px; line-height: 1.4; }
        .match-card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e5e5ea;
        }
        .match-card .campionato { font-size: 10px; font-weight: 800; color: #007aff; text-transform: uppercase; margin-bottom: 4px; }
        .match-card .squadre { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .match-card .data { font-size: 11px; color: #86868b; margin-bottom: 8px; }
        .stat-riga { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-top: 1px solid #f0f0f0; }
        .stat-riga span:first-child { color: #8e8e93; }
        .stat-riga span:last-child { font-weight: 600; }
    </style>
</head>
<body>
    <div class="brand">
        <h1>⚽ Betting Pro Mobile</h1>
        <div class="versione">Versione 0.54 (Direct Native API)</div>
    </div>

    <button id="btnEstrai">Estrai Partite (prossimi 4 giorni)</button>
    <div id="stato"></div>
    <div id="risultati"></div>

    <script>
        // Campionati supportati con ID nativi
        const LEAGUES = [
            { id: "4328", nome: "Serie A" },
            { id: "4329", nome: "Premier League" },
            { id: "4335", nome: "La Liga" },
            { id: "4331", nome: "Bundesliga" },
            { id: "4334", nome: "Ligue 1" }
        ];

        var btn = document.getElementById("btnEstrai");
        var stato = document.getElementById("stato");
        var risultati = document.getElementById("risultati");

        function formattaData(strData, strOra) {
            if (!strData) return "N/D";
            return strData + (strOra ? " " + strOra.substring(0, 5) : "");
        }

        function mostraPartite(partite) {
            risultati.innerHTML = "";
            if (!partite || partite.length === 0) {
                risultati.innerHTML = "<p style='text-align:center; color:#86868b; font-size:13px;'>Nessuna partita trovata nei prossimi 4 giorni.</p>";
                return;
            }
            for (var i = 0; i < partite.length; i++) {
                var p = partite[i];
                var card = document.createElement("div");
                card.className = "match-card";
                card.innerHTML = 
                    "<div class='campionato'>" + p.campionato + "</div>" +
                    "<div class='squadre'>" + p.squadraCasa + " - " + p.squadraOspite + "</div>" +
                    "<div class='data'>" + formattaData(p.data, p.ora) + "</div>" +
                    "<div class='stat-riga'><span>Stadio</span><span>" + p.stadio + "</span></div>" +
                    "<div class='stat-riga'><span>Turno</span><span>Giornata " + p.turno + "</span></div>";
                risultati.appendChild(card);
            }
        }

        btn.addEventListener("click", async function() {
            btn.disabled = true;
            btn.textContent = "Estrazione in corso...";
            risultati.innerHTML = "";

            const oggi = new Date();
            const limite = new Date();
            limite.setDate(oggi.getDate() + 4);

            let listaPartite = [];

            for (let i = 0; i < LEAGUES.length; i++) {
                const l = LEAGUES[i];
                stato.textContent = `Scansione ${l.nome} (${i + 1}/${LEAGUES.length})...`;

                try {
                    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=${l.id}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.events) {
                            data.events.forEach(ev => {
                                const dataEvent = new Date(ev.dateEvent);
                                if (dataEvent >= oggi && dataEvent <= limite) {
                                    listaPartite.push({
                                        campionato: l.nome,
                                        squadraCasa: ev.strHomeTeam,
                                        squadraOspite: ev.strAwayTeam,
                                        data: ev.dateEvent,
                                        ora: ev.strTime,
                                        stadio: ev.strVenue || "N/D",
                                        turno: ev.intRound || "-"
                                    });
                                }
                            });
                        }
                    }
                } catch (e) {
                    console.error("Errore recupero dati:", e);
                }
            }

            stato.textContent = "Estrazione completata. Trovate " + listaPartite.length + " partite.";
            mostraPartite(listaPartite);

            btn.disabled = false;
            btn.textContent = "Estrai Partite (prossimi 4 giorni)";
        });
    </script>
</body>
</html>
