<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerStats ML - Palinsesto & Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f17; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
</head>
<body class="text-slate-100 min-h-screen custom-scrollbar font-sans antialiased pb-12">

    <!-- HEADER / NAVBAR -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    SoccerStats <span class="text-blue-500">ML</span>
                </h1>
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Live Sync Active
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-8 space-y-8">

        <!-- PANNELLO CONTROL ESTRAZIONE E FILTRI -->
        <section class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
            <div class="border-b border-slate-800 pb-4 mb-6">
                <h2 class="text-sm font-bold uppercase tracking-wider text-blue-400">Estrazione &amp; Sincronizzazione Palinsesto</h2>
                <p class="text-xs text-slate-400 mt-1">Seleziona i parametri temporali e i campionati da estrarre:</p>
            </div>

            <!-- PRESET TEMPORALI -->
            <div class="flex flex-wrap gap-2 mb-6">
                <button onclick="setPreset('oggi')" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700/50 transition">Oggi</button>
                <button onclick="setPreset('domani')" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700/50 transition">Domani</button>
                <button onclick="setPreset('weekend')" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700/50 transition">Weekend</button>
                <button onclick="setPreset(7)" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700/50 transition">+7 Giorni</button>
                <button onclick="setPreset(14)" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700/50 transition">+14 Giorni</button>
            </div>

            <!-- INPUT DATE -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Data Inizio</label>
                    <input type="date" id="dateFrom" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Giorni</label>
                    <input type="number" id="daysCount" value="14" min="1" max="30" onchange="calcolaDataFine(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Data Fine</label>
                    <input type="date" id="dateTo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <!-- SELEZIONE CAMPIONATI -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold uppercase text-slate-400">Campionati da estrarre</span>
                    <button onclick="toggleTuttiCampionati()" class="text-xs text-blue-400 hover:underline">Seleziona / Deseleziona Tutti</button>
                </div>
                
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 text-xs">
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="SA" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Serie A</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="PL" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Premier League</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="PD" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">La Liga</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="BL1" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Bundesliga</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="FL1" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Ligue 1</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="CL" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Champions League</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="DED" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Eredivisie</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="PPL" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Liga Portugal</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="BSA" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Brasileirão</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="ELC" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Championship</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="EC" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Europei</span>
                    </label>
                    <label class="flex items-center gap-2 bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" value="WC" checked class="comp-checkbox accent-blue-500 rounded">
                        <span class="font-medium">Mondiali</span>
                    </label>
                </div>
            </div>

            <!-- PULSANTE DI AZIONE -->
            <button id="btnEstrai" onclick="estraiESincronizza()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-2xl transition shadow-lg shadow-emerald-900/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-cloud-arrow-down"></i>
                <span>Estrai Partite e Sincronizza Cloud</span>
            </button>

            <!-- MESSAGGIO DI STATO -->
            <div id="statusBox" class="hidden mt-4 p-3 rounded-xl border text-xs font-semibold text-center transition"></div>
        </section>

        <!-- AREA RISULTATI / CARDS PARTITE -->
        <section id="risultati" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Schede caricate dinamicamente -->
        </section>

    </main>

    <script>
        const WORKER_URL = '/api/estrai'; 
        let partiteCaricate = [];

        document.addEventListener("DOMContentLoaded", () => {
            const oggi = new Date();
            document.getElementById("dateFrom").value = oggi.toISOString().split("T")[0];
            calcolaDataFine(14);

            document.getElementById("dateFrom").addEventListener("change", triggerFiltroLocal);
            document.getElementById("dateTo").addEventListener("change", triggerFiltroLocal);
            document.querySelectorAll(".comp-checkbox").forEach(cb => cb.addEventListener("change", triggerFiltroLocal));
        });

        function calcolaDataFine(giorni) {
            const dateFromVal = document.getElementById("dateFrom").value;
            if (!dateFromVal) return;
            const d = new Date(dateFromVal);
            d.setDate(d.getDate() + parseInt(giorni));
            document.getElementById("dateTo").value = d.toISOString().split("T")[0];
        }

        function setPreset(valore) {
            const oggi = new Date();
            let dInizio = new Date(oggi);
            let dFine = new Date(oggi);

            if (valore === 'domani') {
                dInizio.setDate(dInizio.getDate() + 1);
                dFine.setDate(dFine.getDate() + 1);
            } else if (valore === 'weekend') {
                const day = oggi.getDay();
                const distSabato = (6 - day + 7) % 7;
                dInizio.setDate(dInizio.getDate() + distSabato);
                dFine.setDate(dInizio.getDate() + 1);
            } else if (typeof valore === 'number') {
                dFine.setDate(dFine.getDate() + valore);
            }

            document.getElementById("dateFrom").value = dInizio.toISOString().split("T")[0];
            document.getElementById("dateTo").value = dFine.toISOString().split("T")[0];
            triggerFiltroLocal();
        }

        function toggleTuttiCampionati() {
            const checkboxes = document.querySelectorAll('.comp-checkbox');
            const qualcunoSpuntato = Array.from(checkboxes).some(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !qualcunoSpuntato);
            triggerFiltroLocal();
        }

        function triggerFiltroLocal() {
            if (partiteCaricate && partiteCaricate.length > 0) {
                mostraPartite(partiteCaricate);
            }
        }

        async function estraiESincronizza() {
            const btn = document.getElementById("btnEstrai");
            const dateFrom = document.getElementById("dateFrom").value;
            const dateTo = document.getElementById("dateTo").value;
            const selectedCodes = Array.from(document.querySelectorAll('.comp-checkbox:checked')).map(cb => cb.value);

            if (!dateFrom || !dateTo) {
                showStatus("Seleziona entrambe le date per procedere.", "error");
                return;
            }

            btn.disabled = true;
            btn.classList.add("opacity-50", "cursor-not-allowed");
            showStatus("Estrazione in corso e sincronizzazione Cloud...", "info");

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dateFrom, dateTo, competitions: selectedCodes })
                });

                if (!response.ok) {
                    throw new Error(`Risposta HTTP con stato: ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    partiteCaricate = data.partite || [];
                    showStatus(`Estrazione completata con successo! ${partiteCaricate.length} partite sincronizzate.`, "success");
                    mostraPartite(partiteCaricate);
                } else {
                    showStatus(`Errore nell'estrazione: ${data.error || 'Errore interno'}`, "error");
                }
            } catch (err) {
                console.error("Errore Fetch Worker:", err);
                showStatus("Si è verificato un errore di connessione con il Server Worker.", "error");
            } finally {
                btn.disabled = false;
                btn.classList.remove("opacity-50", "cursor-not-allowed");
            }
        }

        function showStatus(text, type) {
            const statusBox = document.getElementById("statusBox");
            statusBox.classList.remove("hidden", "bg-emerald-950/80", "border-emerald-500", "text-emerald-300", "bg-rose-950/80", "border-rose-500", "text-rose-300", "bg-slate-800", "border-slate-700", "text-slate-300");

            if (type === "success") {
                statusBox.classList.add("bg-emerald-950/80", "border-emerald-500", "text-emerald-300");
            } else if (type === "error") {
                statusBox.classList.add("bg-rose-950/80", "border-rose-500", "text-rose-300");
            } else {
                statusBox.classList.add("bg-slate-800", "border-slate-700", "text-slate-300");
            }

            statusBox.innerText = text;
        }

        function mostraPartite(partite) {
            const risultati = document.getElementById("risultati");
            risultati.innerHTML = "";

            const valFrom = document.getElementById("dateFrom").value;
            const valTo = document.getElementById("dateTo").value;
            const selectedCodes = Array.from(document.querySelectorAll('.comp-checkbox:checked')).map(cb => cb.value.trim().toUpperCase());

            if (!partite || partite.length === 0) {
                risultati.innerHTML = `<div class="col-span-full text-center text-slate-400 text-sm py-8 bg-slate-900/40 rounded-2xl border border-slate-800">Nessuna partita estratta dal server.</div>`;
                return;
            }

            const partiteFiltrate = partite.filter(p => {
                const rawDate = p.dataOraUTC || p.utcDate || p.data || "";
                const dataPartitaIso = rawDate ? rawDate.split("T")[0].trim() : "";

                let dentroData = true;
                if (valFrom && dataPartitaIso) dentroData = dentroData && (dataPartitaIso >= valFrom);
                if (valTo && dataPartitaIso) dentroData = dentroData && (dataPartitaIso <= valTo);

                const codeCamp = (p.campionatoCode || p.campionato || "").toUpperCase();
                const campionatoMatch = selectedCodes.length === 0 || selectedCodes.some(code => codeCamp.includes(code) || code === codeCamp);

                return dentroData && campionatoMatch;
            });

            if (partiteFiltrate.length === 0) {
                risultati.innerHTML = `
                    <div class="col-span-full text-center text-slate-400 text-sm py-8 bg-slate-900/40 rounded-2xl border border-slate-800">
                        <p class="font-bold text-rose-400 mb-1">Nessuna partita visibile con i filtri attuali.</p>
                        <p class="text-xs text-slate-500">Partite totali disponibili: <b>${partite.length}</b></p>
                    </div>`;
                return;
            }

            partiteFiltrate.forEach(p => {
                const gCasa = p.giocateCasa || 0;
                const gOspite = p.giocateOspite || 0;

                const mediaPuntiCasa = gCasa > 0 ? ((p.puntiCasa || 0) / gCasa).toFixed(2) : "0.00";
                const mediaPuntiOspite = gOspite > 0 ? ((p.puntiOspite || 0) / gOspite).toFixed(2) : "0.00";

                const mediaGolFattiCasa = gCasa > 0 ? ((p.golFattiCasa || 0) / gCasa).toFixed(2) : "0.00";
                const mediaGolFattiOspite = gOspite > 0 ? ((p.golFattiOspite || 0) / gOspite).toFixed(2) : "0.00";

                const mediaGolSubitiCasa = gCasa > 0 ? ((p.golSubitiCasa || 0) / gCasa).toFixed(2) : "0.00";
                const mediaGolSubitiOspite = gOspite > 0 ? ((p.golSubitiOspite || 0) / gOspite).toFixed(2) : "0.00";

                const golAttesi = (parseFloat(mediaGolFattiCasa) + parseFloat(mediaGolFattiOspite)).toFixed(2);

                const formaCasaObj = calcolaIndiceForma(p.ultimePartiteCasa, p.formaCasaStringa);
                const formaOspiteObj = calcolaIndiceForma(p.ultimePartiteOspite, p.formaOspiteStringa);

                const htmlUltimeCasa = generaHtmlUltimePartite(p.ultimePartiteCasa);
                const htmlUltimeOspite = generaHtmlUltimePartite(p.ultimePartiteOspite);

                const diffCasa = (p.diffRetiCasa && p.diffRetiCasa > 0) ? `+${p.diffRetiCasa}` : `${p.diffRetiCasa || 0}`;
                const diffOspite = (p.diffRetiOspite && p.diffRetiOspite > 0) ? `+${p.diffRetiOspite}` : `${p.diffRetiOspite || 0}`;

                const card = document.createElement("div");
                card.className = "bg-slate-900/70 border border-slate-800/90 rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col justify-between hover:border-blue-500/50 transition w-full min-w-0";
                card.innerHTML = `
                    <div class="min-w-0">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-800 pb-2.5">
                            <span class="font-bold text-slate-200 uppercase bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700/50">${p.campionato || p.campionatoCode || 'CAMPIONATO'} ${p.giornata ? `(G.${p.giornata})` : ''}</span>
                            <span class="font-mono text-slate-300 text-[11px]">${formattaData(p.dataOraUTC || p.utcDate)}</span>
                        </div>

                        <div class="my-3 text-base sm:text-lg font-bold text-slate-100 flex items-center justify-between gap-2">
                            <span class="truncate text-left flex-1">${p.squadraCasa || 'Casa'}</span>
                            <div class="px-3 py-1 bg-slate-950 border border-emerald-500/50 rounded-xl min-w-[70px] text-center">
                                <span class="text-emerald-400 font-extrabold text-base">${p.risultatoReale || "vs"}</span>
                            </div>
                            <span class="truncate text-right flex-1">${p.squadraOspite || 'Ospite'}</span>
                        </div>

                        <div class="bg-slate-950/70 rounded-2xl p-3 border border-slate-800/80 text-xs space-y-2 my-3">
                            <div class="grid grid-cols-3 text-[10px] font-bold text-slate-400 uppercase border-b border-slate-800 pb-1.5">
                                <div>Dato</div>
                                <div class="text-center truncate">${p.squadraCasa || 'Casa'}</div>
                                <div class="text-right truncate">${p.squadraOspite || 'Ospite'}</div>
                            </div>

                            <div class="grid grid-cols-3 text-slate-200 py-0.5 items-center">
                                <div class="text-slate-400 font-medium">Punti / Posizione</div>
                                <div class="text-center font-bold text-slate-100">${p.puntiCasa ?? 0} <span class="text-slate-400 font-normal">(${p.posizioneCasa ?? '-'}°)</span></div>
                                <div class="text-right font-bold text-slate-100">${p.puntiOspite ?? 0} <span class="text-slate-400 font-normal">(${p.posizioneOspite ?? '-'}°)</span></div>
                            </div>

                            <div class="grid grid-cols-3 text-slate-200 py-0.5 items-center border-t border-slate-800/40">
                                <div class="text-slate-400 font-medium">Partite Giocate</div>
                                <div class="text-center font-semibold">${gCasa}</div>
                                <div class="text-right font-semibold">${gOspite}</div>
                            </div>

                            <div class="grid grid-cols-3 text-slate-200 py-0.5 items-center border-t border-slate-800/40">
                                <div class="text-slate-400 font-medium">V / P / S Generali</div>
                                <div class="text-center font-semibold">${p.vinteCasa ?? 0}/${p.pareggiateCasa ?? 0}/${p.persoCasa ?? 0}</div>
                                <div class="text-right font-semibold">${p.vinteOspite ?? 0}/${p.pareggiateOspite ?? 0}/${p.persoOspite ?? 0}</div>
                            </div>

                            <div class="grid grid-cols-3 text-slate-200 py-0.5 items-center border-t border-slate-800/40">
                                <div class="text-slate-400 font-medium">Gol Fatti / Subiti</div>
                                <div class="text-center font-semibold">${p.golFattiCasa ?? 0} / ${p.golSubitiCasa ?? 0}</div>
                                <div class="text-right font-semibold">${p.golFattiOspite ?? 0} / ${p.golSubitiOspite ?? 0}</div>
                            </div>

                            <div class="grid grid-cols-3 text-slate-200 py-0.5 items-center border-t border-slate-800/40">
                                <div class="text-slate-400 font-medium">Diff. Reti</div>
                                <div class="text-center font-semibold text-slate-300">${diffCasa}</div>
                                <div class="text-right font-semibold text-slate-300">${diffOspite}</div>
                            </div>

                            <div class="grid grid-cols-3 text-slate-200 py-1.5 items-center border-t border-slate-800/80 bg-slate-900/80 px-2 rounded-b-xl">
                                <div class="text-indigo-300 font-bold">Indice Forma</div>
                                <div class="text-center flex flex-col items-center justify-center gap-0.5">
                                    <span class="font-bold text-emerald-400">${formaCasaObj.punteggio}</span>
                                    ${formaCasaObj.simboliHtml}
                                </div>
                                <div class="text-right flex flex-col items-end justify-center gap-0.5">
                                    <span class="font-bold text-emerald-400">${formaOspiteObj.punteggio}</span>
                                    ${formaOspiteObj.simboliHtml}
                                </div>
                            </div>
                        </div>

                        <!-- ULTIME PARTITE -->
                        <div class="bg-slate-950/60 border border-slate-800/60 rounded-xl p-2.5 my-2 text-xs">
                            <div class="text-[9px] text-slate-400 uppercase font-semibold border-b border-slate-800 pb-1 mb-1.5 flex justify-between">
                                <span>Ultime Partite Casa</span>
                                <span>Ultime Partite Trasferta</span>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>${htmlUltimeCasa}</div>
                                <div class="border-l border-slate-800 pl-3">${htmlUltimeOspite}</div>
                            </div>
                        </div>

                        <!-- MEDIE E GOL ATTESI -->
                        <div class="grid grid-cols-4 gap-1.5 my-3 text-center">
                            <div class="bg-slate-950 border border-slate-800 p-1.5 rounded-xl">
                                <div class="text-[8px] text-slate-400 uppercase font-semibold truncate">Media Punti</div>
                                <div class="text-[11px] font-bold text-emerald-400 mt-0.5">${mediaPuntiCasa} | ${mediaPuntiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-1.5 rounded-xl">
                                <div class="text-[8px] text-slate-400 uppercase font-semibold truncate">Media Gol Fatti</div>
                                <div class="text-[11px] font-bold text-blue-400 mt-0.5">${mediaGolFattiCasa} | ${mediaGolFattiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-1.5 rounded-xl">
                                <div class="text-[8px] text-slate-400 uppercase font-semibold truncate">Media Gol Subiti</div>
                                <div class="text-[11px] font-bold text-rose-400 mt-0.5">${mediaGolSubitiCasa} | ${mediaGolSubitiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-1.5 rounded-xl">
                                <div class="text-[8px] text-slate-400 uppercase font-semibold truncate">Gol Attesi</div>
                                <div class="text-[11px] font-bold text-indigo-300 mt-0.5">${golAttesi}</div>
                            </div>
                        </div>
                    </div>
                `;
                risultati.appendChild(card);
            });
        }

        function formattaData(isoStr) {
            if (!isoStr) return "-";
            try {
                const d = new Date(isoStr);
                return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
            } catch {
                return isoStr;
            }
        }

        function calcolaIndiceForma(ultimeArr, strForma) {
            let ptn = 0;
            let simboli = "";

            if (Array.isArray(ultimeArr) && ultimeArr.length > 0) {
                ultimeArr.slice(-5).forEach(m => {
                    if (m && (m.risultato === 'W' || m.esito === 'V')) {
                        ptn += 3;
                        simboli += `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mx-0.5"></span>`;
                    } else if (m && (m.risultato === 'D' || m.esito === 'P')) {
                        ptn += 1;
                        simboli += `<span class="inline-block w-2 h-2 rounded-full bg-amber-500 mx-0.5"></span>`;
                    } else {
                        simboli += `<span class="inline-block w-2 h-2 rounded-full bg-rose-500 mx-0.5"></span>`;
                    }
                });
            } else if (typeof strForma === "string" && strForma.trim() !== "") {
                const arr = strForma.split(",");
                arr.slice(-5).forEach(res => {
                    const r = res.trim().toUpperCase();
                    if (r === 'W' || r === 'V') {
                        ptn += 3;
                        simboli += `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mx-0.5"></span>`;
                    } else if (r === 'D' || r === 'P') {
                        ptn += 1;
                        simboli += `<span class="inline-block w-2 h-2 rounded-full bg-amber-500 mx-0.5"></span>`;
                    } else {
                        simboli += `<span class="inline-block w-2 h-2 rounded-full bg-rose-500 mx-0.5"></span>`;
                    }
                });
            }

            return {
                punteggio: `${ptn}/15`,
                simboliHtml: `<div class="flex items-center">${simboli || '<span class="text-slate-600">-</span>'}</div>`
            };
        }

        function generaHtmlUltimePartite(arr) {
            if (!Array.isArray(arr) || arr.length === 0) {
                return `<div class="text-slate-500 italic text-[10px]">N.D.</div>`;
            }
            return arr.slice(-3).map(m => `
                <div class="flex justify-between items-center text-[10px] py-0.5">
                    <span class="truncate text-slate-300 max-w-[80px]">${m.avversario || 'N.D.'}</span>
                    <span class="font-mono font-bold ${m.risultato === 'W' ? 'text-emerald-400' : m.risultato === 'D' ? 'text-amber-400' : 'text-rose-400'}">${m.punteggio || 'v'}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
