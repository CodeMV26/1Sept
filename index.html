<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white font-sans antialiased pb-24">

    <!-- HEADER -->
    <header class="p-4 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">SoccerStats ML</h1>
            </div>
            <div id="syncBadge" class="px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800/60 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Firebase Ready
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 my-2">
        
        <!-- SEZIONE PALINSESTO -->
        <section id="sec-palinsesto" class="space-y-6">
            <div class="bg-slate-900/60 border border-slate-800/80 p-6 rounded-3xl shadow-2xl backdrop-blur-xl max-w-2xl mx-auto">
                <h2 class="text-xs font-bold tracking-widest text-blue-400 uppercase mb-4 flex items-center gap-2">
                    FILTRA & IMPORTA PALINSESTO
                </h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Data Inizio</label>
                        <input type="date" id="dateFrom" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Data Fine</label>
                        <input type="date" id="dateTo" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <button id="btnSync" onclick="sincronizzaPalinsesto()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer">
                    Sincronizza / Importa Palinsesto
                </button>

                <div id="statusMessage" class="hidden mt-4 p-3 rounded-xl text-xs text-center border"></div>
            </div>

            <!-- CONTENITORE CARDS DOVE VENGONO MOSTRATE LE PARTITE -->
            <div id="containerCards" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6"></div>
        </section>

    </main>

    <!-- FOOTER NAV -->
    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 p-2 max-w-lg w-[calc(100%-2rem)] z-50">
        <div class="bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-full p-1.5 shadow-2xl flex justify-between items-center">
            <button class="flex-1 py-2 px-3 rounded-full bg-blue-600 text-white text-xs font-semibold">Palinsesto</button>
            <button class="flex-1 py-2 px-3 rounded-full text-slate-400 text-xs font-semibold">Validazione</button>
            <button class="flex-1 py-2 px-3 rounded-full text-slate-400 text-xs font-semibold">Archivio</button>
            <button class="flex-1 py-2 px-3 rounded-full text-slate-400 text-xs font-semibold">ML Engine</button>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvZ6My0UlFyzAIMvKvWdNneQPajryjvsw",
            authDomain: "betting-pro-db.firebaseapp.com",
            projectId: "betting-pro-db",
            storageBucket: "betting-pro-db.firebasestorage.app",
            messagingSenderId: "157886609369",
            appId: "1:157886609369:web:565f3a44ec8d1dba3c8bc8"
        };
        firebase.initializeApp(firebaseConfig);

        let memoriaPalinsesto = [];

        window.onload = function() {
            // Imposta di default la data odierna e tra 7 giorni
            const oggi = new Date();
            const tra7giorni = new Date();
            tra7giorni.setDate(oggi.getDate() + 7);

            document.getElementById('dateFrom').value = oggi.toISOString().split('T')[0];
            document.getElementById('dateTo').value = tra7giorni.toISOString().split('T')[0];

            // Chiamata automatica all'avvio
            sincronizzaPalinsesto();
        };

        function mostraMessaggio(testo, tipo = 'info') {
            const msgBox = document.getElementById('statusMessage');
            msgBox.classList.remove('hidden', 'bg-rose-950/80', 'border-rose-800', 'text-rose-300', 'bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300', 'bg-blue-950/80', 'border-blue-800', 'text-blue-300');
            
            if (tipo === 'error') msgBox.classList.add('bg-rose-950/80', 'border-rose-800', 'text-rose-300');
            else if (tipo === 'success') msgBox.classList.add('bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300');
            else msgBox.classList.add('bg-blue-950/80', 'border-blue-800', 'text-blue-300');

            msgBox.innerText = testo;
        }

        async function sincronizzaPalinsesto() {
            const btn = document.getElementById('btnSync');
            btn.innerText = "Estrazione API in corso...";
            btn.disabled = true;
            mostraMessaggio("Connessione in corso a Football-Data API...", "info");

            const workerUrl = "https://betting-pro-1sept.mvmymail.workers.dev/api/palinsesto";
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            try {
                const response = await fetch(`${workerUrl}?dateFrom=${dateFrom}&dateTo=${dateTo}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error + (data.details ? `: ${data.details}` : ''));
                }

                const matches = data.matches || [];

                if (matches.length > 0) {
                    memoriaPalinsesto = matches;
                    renderizzaPalinsesto(memoriaPalinsesto);
                    mostraMessaggio(`SUCCESS: Estratte ed elaborate ${matches.length} partite dall'API!`, "success");
                } else {
                    document.getElementById('containerCards').innerHTML = '';
                    mostraMessaggio(`L'API ha risposto con 0 partite nel range ${dateFrom} - ${dateTo}. Prova ad allargare le date al prossimo weekend.`, "error");
                }

            } catch (err) {
                console.error("Errore estrazione:", err);
                mostraMessaggio("ERRORE ESTRAZIONE: " + err.message, "error");
            } finally {
                btn.innerText = "Sincronizza / Importa Palinsesto";
                btn.disabled = false;
            }
        }

        function renderizzaPalinsesto(partite) {
            const container = document.getElementById('containerCards');
            container.innerHTML = '';

            partite.forEach(p => {
                const homeName = p.homeTeam?.name || p.homeTeam?.shortName || "Casa";
                const awayName = p.awayTeam?.name || p.awayTeam?.shortName || "Trasferta";
                const campionato = p.competition?.name || "Campionato";
                const dataMatch = p.utcDate ? new Date(p.utcDate).toLocaleString('it-IT', { day: '2-2digit', month: '2-2digit', hour: '2-2digit', minute: '2-2digit' }) : 'Da definire';

                const cardHtml = `
                <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-5 shadow-xl flex flex-col justify-between hover:border-blue-500/50 transition">
                    <div>
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-800/80 pb-2">
                            <span class="font-bold text-blue-400 uppercase tracking-wider">${campionato}</span>
                            <span class="font-mono text-slate-300">${dataMatch}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-4 my-4">
                            <div class="space-y-1">
                                <div class="text-base font-bold text-slate-100">${homeName}</div>
                                <div class="text-xs text-emerald-400 font-semibold">Casa</div>
                            </div>
                            <div class="space-y-1 text-right">
                                <div class="text-base font-bold text-slate-100">${awayName}</div>
                                <div class="text-xs text-indigo-400 font-semibold">Ospite</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-3 flex justify-between items-center mt-2">
                        <div>
                            <div class="text-[10px] uppercase font-bold text-slate-400">Stato Partita</div>
                            <div class="text-xs font-semibold text-blue-400">${p.status || 'SCHEDULED'}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs font-bold text-emerald-400">Pronta per ML</div>
                        </div>
                    </div>
                </div>`;

                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }
    </script>
</body>
</html>
