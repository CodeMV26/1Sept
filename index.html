<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dashboard Analisi Pronostici Calcio</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent-blue: #2563eb;
      --accent-green: #16a34a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: clamp(8px, 2vw, 20px);
      line-height: 1.4;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* HEADER & CONTROLS */
    header {
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #60a5fa;
      margin-bottom: 4px;
    }

    .meta-info {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: var(--card-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      margin-bottom: 15px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
      flex: 1 1 auto;
      text-align: center;
    }

    button:hover { opacity: 0.9; }
    .btn-blue { background-color: var(--accent-blue); }
    .btn-green { background-color: var(--accent-green); }

    .filter-group {
      display: flex;
      gap: 6px;
      flex: 2 1 280px;
    }

    select, input {
      width: 100%;
      padding: 7px 10px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: white;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    /* TABELLA RIASSUNTIVA COMPATTA */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .summary-card h2 {
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #93c5fd;
    }

    .table-wrapper {
      overflow-x: auto;
      max-height: 250px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }

    th, td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--card-border);
    }

    th {
      background: #0f172a;
      color: var(--text-secondary);
      position: sticky;
      top: 0;
    }

    /* GRIGLIA CARTE PARTITA */
    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(290px, 100%, 360px), 1fr));
      gap: 12px;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 4px;
    }

    .match-number {
      background: var(--accent-blue);
      color: white;
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .teams-title {
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      margin: 4px 0;
    }

    /* STATISTICHE DETTAGLIATE SCHEDA */
    .stats-table {
      width: 100%;
      font-size: 0.72rem;
      border-collapse: collapse;
      margin-top: 4px;
    }

    .stats-table td {
      padding: 3px 4px;
      border-bottom: 1px dashed #334155;
    }

    .stats-table td:nth-child(1) { width: 40%; color: #cbd5e1; }
    .stats-table td:nth-child(2) { width: 30%; text-align: center; font-weight: 600; }
    .stats-table td:nth-child(3) { width: 30%; text-align: center; font-weight: 600; }

    .top-scorer {
      font-size: 0.7rem;
      background: #0f172a;
      padding: 6px;
      border-radius: 4px;
      margin-top: 4px;
      color: #fcd34d;
    }

    @media (max-width: 480px) {
      body { padding: 6px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .filter-group { flex-direction: column; }
      .stats-table { font-size: 0.68rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚽ Dashboard Analisi Pronostici Calcio</h1>
    <div class="meta-info" id="metaInfo">Caricamento stato...</div>
  </header>

  <div class="toolbar">
    <button class="btn-blue" onclick="aggiornaPalinsesto(true)">🔄 Aggiorna Palinsesto</button>
    <button class="btn-green" onclick="aggiornaPalinsesto(false)">✓ Valida Risultati</button>
    <div class="filter-group">
      <select id="filterCampionato" onchange="renderData()">
        <option value="ALL">Tutti i Campionati</option>
      </select>
      <input type="text" id="searchTeam" placeholder="Cerca squadra..." oninput="renderData()">
    </div>
  </div>

  <div class="summary-card">
    <h2>📊 Riassunto Partite per Campionato</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Campionato</th>
            <th style="text-align: right;">Totale</th>
          </tr>
        </thead>
        <tbody id="summaryBody">
          <tr><td colspan="2">Nessun dato caricato</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="matchesContainer" class="matches-grid"></div>
</div>

<script>
  // INSERISCI QUI IL TUO URL CLOUDFLARE WORKER
  const WORKER_URL = "https://betting-pro-1sept.TUOSOTTO_DOMINIO.workers.dev"; 

  let globalData = { me: [], resoconto: [] };

  async function loadData(force = false) {
    const metaEl = document.getElementById('metaInfo');
    metaEl.innerText = "Sincronizzazione in corso...";

    try {
      const url = `${WORKER_URL}?force=${force}`;
      const res = await fetch(url);
      const data = await res.json();

      if(data && data.partite) {
        globalData = data;
        metaEl.innerText = `Ultimo Aggiornamento: ${data.dataAggiornamento || 'N/A'}`;
        populateCampionatiFilter();
        renderData();
      } else {
        metaEl.innerText = "Nessun dato presente nel KV Store. Clicca su Aggiorna Palinsesto.";
      }
    } catch(err) {
      metaEl.innerText = "Errore di connessione al Worker.";
    }
  }

  function populateCampionatiFilter() {
    const select = document.getElementById('filterCampionato');
    select.innerHTML = '<option value="ALL">Tutti i Campionati</option>';
    
    if(!globalData.partite) return;
    const campionati = [...new Set(globalData.partite.map(m => m.campionato))];
    campionati.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    });
  }

  function renderData() {
    const selectedCamp = document.getElementById('filterCampionato').value;
    const search = document.getElementById('searchTeam').value.toLowerCase();
    
    const summaryBody = document.getElementById('summaryBody');
    const matchesContainer = document.getElementById('matchesContainer');

    if(!globalData.partite || globalData.partite.length === 0) {
      summaryBody.innerHTML = '<tr><td colspan="2">Trovate 0 Partite</td></tr>';
      matchesContainer.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Nessuna scheda partita disponibile.</p>';
      return;
    }

    // Filter matches
    const filtered = globalData.partite.filter(m => {
      const matchCamp = selectedCamp === "ALL" || m.campionato === selectedCamp;
      const matchSearch = !search || m.casa.toLowerCase().includes(search) || m.trasferta.toLowerCase().includes(search);
      return matchCamp && matchSearch;
    });

    // Render Table Summary
    const counts = {};
    globalData.partite.forEach(m => counts[m.campionato] = (counts[m.campionato] || 0) + 1);
    
    let summaryHTML = '';
    Object.keys(counts).forEach(camp => {
      summaryHTML += `<tr><td>${camp}</td><td style="text-align: right; font-weight: bold;">${counts[camp]}</td></tr>`;
    });
    summaryHTML += `<tr style="background:#0f172a; font-weight:bold;"><td>TOTALE COMPLESSIVO</td><td style="text-align: right;">${globalData.partite.length}</td></tr>`;
    summaryBody.innerHTML = summaryHTML;

    // Render Match Cards with Progressive Numbering & Full Stats
    matchesContainer.innerHTML = '';
    filtered.forEach((m, idx) => {
      const card = document.createElement('div');
      card.className = 'match-card';

      // Fallback sicuro per statistiche vuote
      const s = m.stats || {};
      
      card.innerHTML = `
        <div class="match-header">
          <span class="match-number">#${idx + 1}</span>
          <span>${m.campionato || 'Campionato'}</span>
          <span>${m.ora || '20:45'}</span>
        </div>
        <div class="teams-title">${m.casa} vs ${m.trasferta}</div>
        
        <table class="stats-table">
          <thead>
            <tr style="color: #60a5fa;">
              <th>Statistica</th>
              <th>Casa</th>
              <th>Ospite</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Posiz. / Punti</td><td>${s.posCasa || '-'} (${s.puntiCasa || 0}p)</td><td>${s.posTrasferta || '-'} (${s.puntiTrasferta || 0}p)</td></tr>
            <tr><td>Giocate (V/P/S)</td><td>${s.vpsCasa || '0/0/0'}</td><td>${s.vpsTrasferta || '0/0/0'}</td></tr>
            <tr><td>Gol Fatti/Subiti</td><td>${s.golCasa || '0:0'}</td><td>${s.golTrasferta || '0:0'}</td></tr>
            <tr><td>Casa / Trasferta</td><td>${s.puntiSoloCasa || 0}p (${s.vpsSoloCasa || '0/0/0'})</td><td>${s.puntiSoloTrasferta || 0}p (${s.vpsSoloTrasferta || '0/0/0'})</td></tr>
            <tr><td>Indice Forma</td><td>${s.formaCasa || 'N/D'}</td><td>${s.formaTrasferta || 'N/D'}</td></tr>
            <tr><td>Trend Recente</td><td>${s.trendCasa || '-----'}</td><td>${s.trendTrasferta || '-----'}</td></tr>
          </tbody>
        </table>

        ${m.topScorer ? `<div class="top-scorer">⭐ Top Scorer: ${m.topScorer}</div>` : ''}
      `;
      matchesContainer.appendChild(card);
    });
  }

  function aggiornaPalinsesto(force) {
    if(confirm(force ? "Vuoi forzare la rigenerazione completa del palinsesto?" : "Vuoi convalidare i risultati reali?")) {
      loadData(force);
    }
  }

  // Caricamento iniziale
  loadData(false);
</script>
</body>
</html>
