<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="algorithmEngine.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- HEADER -->
    <header class="p-4 flex justify-between items-center max-w-6xl mx-auto w-full">
        <h1 class="text-2xl font-bold text-blue-400">SoccerStats ML</h1>
        <div id="syncBadge" class="px-3 py-1 bg-gray-800 text-gray-400 rounded-full text-xs font-semibold border border-gray-700">
            Verifica configurazione...
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col items-center justify-center">
        
        <!-- CARD FILTRI & IMPORTAZIONI -->
        <div class="bg-slate-800/60 border border-slate-700/50 p-6 rounded-2xl max-w-xl w-full shadow-2xl backdrop-blur-sm">
            <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase mb-4">Filtra & Importa Palinsesto</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Data Inizio</label>
                    <input type="date" id="dateFrom" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Data Fine</label>
                    <input type="date" id="dateTo" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <button id="btnSync" onclick="sincronizzaPalinsesto()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl shadow-lg transition duration-200">
                Sincronizza / Importa Palinsesto
            </button>
        </div>

        <!-- TABELLA RISULTATI (PALINSESTO) -->
        <div id="containerRisultati" class="w-full mt-8 hidden">
            <h3 class="text-lg font-semibold text-slate-200 mb-3">Partite Trovate (<span id="txtTotale">0</span>)</h3>
            <div class="overflow-x-auto bg-slate-800/40 rounded-xl border border-slate-700/50">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-800 text-slate-400 text-xs uppercase border-b border-slate-700">
                        <tr>
                            <th class="px-4 py-3">Data/Ora</th>
                            <th class="px-4 py-3">Campionato</th>
                            <th class="px-4 py-3">Partita</th>
                            <th class="px-4 py-3 text-center">Stato</th>
                        </tr>
                    </thead>
                    <tbody id="tbPalinsesto" class="divide-y divide-slate-700/50">
                        <!-- Popolato via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- FOOTER NAV -->
    <footer class="p-4 flex justify-center space-x-2 border-t border-slate-800 bg-slate-950/40">
        <button class="px-5 py-1.5 rounded-full bg-blue-600 text-white text-sm font-medium">Palinsesto</button>
        <button class="px-5 py-1.5 rounded-full text-slate-400 hover:text-white text-sm font-medium">Validazione</button>
        <button class="px-5 py-1.5 rounded-full text-slate-400 hover:text-white text-sm font-medium">Archivio</button>
        <button class="px-5 py-1.5 rounded-full text-slate-400 hover:text-white text-sm font-medium">ML Engine</button>
    </footer>

    <!-- LOGICA DI SISTEMA COMPLETA -->
    <script>
        // Inizializzazione Date di Default
        const oggi = new Date().toISOString().split('T')[0];
        document.getElementById('dateFrom').value = oggi;
        document.getElementById('dateTo').value = oggi;

        // Recupero Configurazione da LocalStorage
        function getConfig() {
            let firebaseCfg = localStorage.getItem('firebaseConfig') || localStorage.getItem('firebase_config');
            let workerUrl = localStorage.getItem('workerUrl') || localStorage.getItem('worker_url');

            if (!firebaseCfg || !workerUrl) {
                return null;
            }

            try {
                return {
                    firebaseConfig: typeof firebaseCfg === 'string' && firebaseCfg.startsWith('{') ? JSON.parse(firebaseCfg) : firebaseCfg,
                    workerUrl: workerUrl.replace(/\/$/, "")
                };
            } catch (e) {
                return null;
            }
        }

        // Verifica Stato Sync Badge
        const cfg = getConfig();
        const syncBadge = document.getElementById('syncBadge');
        if (cfg) {
            syncBadge.className = "px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800/60";
            syncBadge.innerText = "Sync OK";
        } else {
            syncBadge.className = "px-3 py-1 bg-amber-950/80 text-amber-400 rounded-full text-xs font-semibold border border-amber-800/60";
            syncBadge.innerText = "Non Configurato";
        }

        // FUNZIONE DI SINCRONIZZAZIONE CORRETTA
        async function sincronizzaPalinsesto() {
            const config = getConfig();
            if (!config) {
                const fbInput = prompt("Incolla l'oggetto JSON di configurazione Firebase (firebaseConfig):");
                if (!fbInput) return;
                const wkInput = prompt("Inserisci l'URL del tuo Cloudflare Worker:");
                if (!wkInput) return;

                localStorage.setItem('firebaseConfig', fbInput);
                localStorage.setItem('workerUrl', wkInput);
                location.reload();
                return;
            }

            const btn = document.getElementById('btnSync');
            btn.innerText = "Sincronizzazione in corso...";
            btn.disabled = true;

            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            // LISTA PULITA CAMPIONATI (Senza encodare oggetti JSON nell'URL)
            const campionatiList = "SA,PL,PD,BL1,FL1,CL,DED,PPL,BSA,ELC,CLI,WC";

            const endpoint = `${config.workerUrl}/api/palinsesto?dateFrom=${dateFrom}&dateTo=${dateTo}&campionati=${campionatiList}`;

            try {
                const res = await fetch(endpoint);
                const data = await res.json();

                if (data.errore) {
                    alert("Errore API: " + (data.messaggio || "Impossibile recuperare i dati"));
                    return;
                }

                mostraRisultati(data.partite || []);
            } catch (err) {
                alert("Errore Sincronizzazione: " + err.message);
            } finally {
                btn.innerText = "Sincronizza / Importa Palinsesto";
                btn.disabled = false;
            }
        }

        // MOSTRA I DATI NELLA TABELLA
        function mostraRisultati(partite) {
            const container = document.getElementById('containerRisultati');
            const tbody = document.getElementById('tbPalinsesto');
            const txtTotale = document.getElementById('txtTotale');

            tbody.innerHTML = '';
            txtTotale.innerText = partite.length;

            if (partite.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-500">Nessuna partita trovata per il periodo selezionato.</td></tr>`;
            } else {
                partite.forEach(p => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-slate-800/60 transition";
                    row.innerHTML = `
                        <td class="px-4 py-3 font-mono text-xs text-slate-400">${p.data || p.date || '-'}</td>
                        <td class="px-4 py-3 font-medium text-blue-400">${p.campionato || p.league || '-'}</td>
                        <td class="px-4 py-3 text-slate-200 font-semibold">${p.homeTeam || p.squadraCasa || ''} vs ${p.awayTeam || p.squadraOspite || ''}</td>
                        <td class="px-4 py-3 text-center"><span class="px-2 py-0.5 text-xs bg-slate-700 text-slate-300 rounded">${p.status || 'Programmata'}</span></td>
                    `;
                    tbody.appendChild(row);
                });
            }

            container.classList.remove('hidden');
        }
    </script>
</body>
</html>
