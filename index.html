<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-28 font-sans">

    <header class="p-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">SoccerStats ML</h1>
            <div id="syncBadge" class="px-3 py-1 bg-emerald-950 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800">
                Live Sync
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 my-2">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl max-w-2xl mx-auto mb-6">
            <h2 class="text-xs font-bold text-blue-400 uppercase mb-3">ESTRAZIONE PALINSESTO</h2>

            <div class="flex flex-wrap gap-2 mb-4">
                <button onclick="impostaIntervalloPreset('oggi')" class="bg-slate-800 text-xs px-3 py-1 rounded border border-slate-700">Oggi</button>
                <button onclick="impostaIntervalloPreset('domani')" class="bg-slate-800 text-xs px-3 py-1 rounded border border-slate-700">Domani</button>
                <button onclick="impostaIntervalloPreset('weekend')" class="bg-slate-800 text-xs px-3 py-1 rounded border border-slate-700">Weekend</button>
                <button onclick="impostaIntervalloPreset(7)" class="bg-slate-800 text-xs px-3 py-1 rounded border border-slate-700">+7 Giorni</button>
                <button onclick="impostaIntervalloPreset(14)" class="bg-slate-800 text-xs px-3 py-1 rounded border border-slate-700">+14 Giorni</button>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-4">
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Inizio</label>
                    <input type="date" id="dateFrom" class="w-full bg-slate-950 border border-slate-800 text-xs p-2 rounded-xl">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Giorni</label>
                    <input type="number" id="daysOffset" value="14" class="w-full bg-slate-950 border border-slate-800 text-xs p-2 rounded-xl">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 block mb-1">Fine</label>
                    <input type="date" id="dateTo" class="w-full bg-slate-950 border border-slate-800 text-xs p-2 rounded-xl">
                </div>
            </div>

            <button id="btnEstrai" onclick="sincronizzaESalva()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-xl text-sm">
                Estrai Partite e Sincronizza Cloud
            </button>
            <div id="stato" class="hidden mt-3 p-3 rounded-xl text-xs text-center border"></div>
        </div>

        <div id="risultati" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvZ6My0UlFyzAIMvKvWdNneQPajryjvsw",
            authDomain: "betting-pro-db.firebaseapp.com",
            projectId: "betting-pro-db",
            storageBucket: "betting-pro-db.firebasestorage.app",
            messagingSenderId: "157886609369",
            appId: "1:157886609369:web:565f3a44ec8d1dba3c8bc8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const WORKER_URL = "https://betting-pro-api.mvmymail.workers.dev/";
        let cachePartite = [];

        function formattaIso(d) { return d.toISOString().split("T")[0]; }

        function impostaIntervalloPreset(tipo) {
            const d1 = new Date();
            const d2 = new Date();
            if (tipo === 'domani') { d1.setDate(d1.getDate() + 1); d2.setDate(d2.getDate() + 1); }
            else if (tipo === 'weekend') {
                const day = d1.getDay();
                const diff = (5 - day + 7) % 7;
                d1.setDate(d1.getDate() + diff);
                d2.setDate(d1.getDate() + 2);
            } else if (typeof tipo === 'number') {
                d2.setDate(d1.getDate() + tipo);
            }
            document.getElementById("dateFrom").value = formattaIso(d1);
            document.getElementById("dateTo").value = formattaIso(d2);
        }

        window.onload = function() {
            impostaIntervalloPreset(14);
            db.collection("palinsesto").doc("corrente").onSnapshot(doc => {
                if (doc.exists) {
                    cachePartite = doc.data().partite || [];
                    mostraPartite(cachePartite);
                }
            });
        };

        function calcolaForma(ultime) {
            if (!ultime || ultime.length === 0) return { html: `<span class="text-slate-500 text-[10px]">N/D</span>`, val: "0.0 / 5.0" };
            let p = 0;
            let h = `<div class="flex gap-1 justify-center sm:justify-start">`;
            ultime.forEach(m => {
                if (m.esito === "W") { p += 1.0; h += `<span class="w-3.5 h-3.5 rounded-sm bg-emerald-500"></span>`; }
                else if (m.esito === "D") { p += 0.5; h += `<span class="w-3.5 h-3.5 rounded-sm bg-amber-400"></span>`; }
                else { h += `<span class="w-3.5 h-3.5 rounded-sm bg-rose-500"></span>`; }
            });
            h += `</div>`;
            return { html: h, val: `${p.toFixed(1)} / 5.0` };
        }

        function renderUltime5(ultime) {
            if (!ultime || ultime.length === 0) return `<div class="text-[10px] text-slate-500">Nessun dato</div>`;
            return ultime.map(m => `
                <div class="flex justify-between text-[10px] py-0.5">
                    <span class="text-slate-400">${m.esito === "W" ? "Vittoria" : (m.esito === "D" ? "Pareggio" : "Sconfitta")}</span>
                    <span class="font-bold ${m.esito === "W" ? 'text-emerald-400' : m.esito === "D" ? 'text-amber-400' : 'text-rose-400'}">${m.esito}</span>
                </div>
            `).join("");
        }

        function mostraPartite(partite) {
            const container = document.getElementById("risultati");
            container.innerHTML = "";

            partite.forEach(p => {
                const formaC = calcolaForma(p.ultimePartiteCasa);
                const formaO = calcolaForma(p.ultimePartiteOspite);

                const card = document.createElement("div");
                card.className = "bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl";
                card.innerHTML = `
                    <div class="flex justify-between text-xs text-slate-400 mb-3 border-b border-slate-800 pb-2">
                        <span class="font-bold text-slate-200">${p.campionato}</span>
                        <span>${p.dataOraUTC ? p.dataOraUTC.replace('T', ' ').substring(0, 16) : ''}</span>
                    </div>

                    <div class="my-3 text-lg font-bold text-slate-100 flex justify-between">
                        <span>${p.squadraCasa}</span>
                        <span class="text-emerald-400 font-mono">${p.risultatoReale || "VS"}</span>
                        <span>${p.squadraOspite}</span>
                    </div>

                    <div class="bg-slate-950 rounded-2xl p-3 border border-slate-800/80 text-xs space-y-2 my-3">
                        <div class="grid grid-cols-3 text-[10px] font-bold text-slate-400 border-b border-slate-800 pb-1">
                            <div>DATO</div>
                            <div class="text-center">${p.squadraCasa}</div>
                            <div class="text-right">${p.squadraOspite}</div>
                        </div>

                        <div class="grid grid-cols-3 py-0.5">
                            <div class="text-slate-400">Punti / Pos.</div>
                            <div class="text-center font-bold">${p.puntiCasa} (${p.posizioneCasa}°)</div>
                            <div class="text-right font-bold">${p.puntiOspite} (${p.posizioneOspite}°)</div>
                        </div>

                        <div class="grid grid-cols-3 py-0.5 border-t border-slate-800/40">
                            <div class="text-slate-400">V / P / S Generali</div>
                            <div class="text-center">${p.vinteCasa}/${p.pareggiateCasa}/${p.persoCasa}</div>
                            <div class="text-right">${p.vinteOspite}/${p.pareggiateOspite}/${p.persoOspite}</div>
                        </div>

                        <div class="grid grid-cols-3 py-0.5 border-t border-slate-800/40">
                            <div class="text-slate-400">Diff. Reti</div>
                            <div class="text-center">${p.diffRetiCasa > 0 ? '+'+p.diffRetiCasa : p.diffRetiCasa}</div>
                            <div class="text-right">${p.diffRetiOspite > 0 ? '+'+p.diffRetiOspite : p.diffRetiOspite}</div>
                        </div>

                        <div class="grid grid-cols-3 py-0.5 border-t border-slate-800/40 bg-slate-900/60 px-1 rounded">
                            <div class="text-blue-300 font-semibold">Punti Specifici</div>
                            <div class="text-center font-bold text-blue-400">${p.puntiCasaInCasa ?? 0} (Casa)</div>
                            <div class="text-right font-bold text-blue-400">${p.puntiOspiteInTrasferta ?? 0} (Trasf.)</div>
                        </div>

                        <div class="grid grid-cols-3 py-0.5 border-t border-slate-800/40 bg-slate-900/60 px-1 rounded">
                            <div class="text-blue-300 font-semibold">V/P/S Specifici</div>
                            <div class="text-center font-semibold">${p.vinteCasaInCasa ?? 0}/${p.pareggiateCasaInCasa ?? 0}/${p.persoCasaInCasa ?? 0}</div>
                            <div class="text-right font-semibold">${p.vinteOspiteInTrasferta ?? 0}/${p.pareggiateOspiteInTrasferta ?? 0}/${p.persoOspiteInTrasferta ?? 0}</div>
                        </div>

                        <div class="grid grid-cols-3 py-0.5 border-t border-slate-800/40 bg-slate-900/60 px-1 rounded">
                            <div class="text-blue-300 font-semibold">Gol Spec. Fatti/Sub.</div>
                            <div class="text-center font-semibold">${p.golFattiCasaInCasa ?? 0} / ${p.golSubitiCasaInCasa ?? 0}</div>
                            <div class="text-right font-semibold">${p.golFattiOspiteInTrasferta ?? 0} / ${p.golSubitiOspiteInTrasferta ?? 0}</div>
                        </div>

                        <div class="grid grid-cols-3 py-2 border-t border-slate-800 bg-slate-900 px-1 rounded">
                            <div class="text-indigo-300 font-bold">Indice Forma</div>
                            <div class="text-center flex flex-col items-center">
                                <span class="font-bold text-emerald-400">${formaC.val}</span>
                                ${formaC.html}
                            </div>
                            <div class="text-right flex flex-col items-end">
                                <span class="font-bold text-emerald-400">${formaO.val}</span>
                                ${formaO.html}
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs my-2">
                        <div class="text-[9px] text-slate-400 font-bold border-b border-slate-800 pb-1 mb-1 flex justify-between">
                            <span>Ultime 5 Casa</span>
                            <span>Ultime 5 Trasferta</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>${renderUltime5(p.ultimePartiteCasa)}</div>
                            <div class="border-l border-slate-800 pl-2">${renderUltime5(p.ultimePartiteOspite)}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function sincronizzaESalva() {
            const btn = document.getElementById("btnEstrai");
            const dFrom = document.getElementById("dateFrom").value;
            const dTo = document.getElementById("dateTo").value;
            const st = document.getElementById("stato");

            btn.disabled = true;
            st.classList.remove("hidden");
            st.innerText = "Estrazione dati dall'API in corso...";

            try {
                const res = await fetch(`${WORKER_URL}?dateFrom=${dFrom}&dateTo=${dTo}`);
                const data = await res.json();
                if (data.partite) {
                    await db.collection("palinsesto").doc("corrente").set({
                        partite: data.partite,
                        ultimoAggiornamento: new Date().toLocaleString()
                    });
                    st.innerText = `Sincronizzate ${data.partite.length} partite con successo!`;
                }
            } catch (e) {
                st.innerText = "Errore: " + e.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
