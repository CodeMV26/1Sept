<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white font-sans antialiased pb-24">

    <!-- HEADER -->
    <header class="p-4 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">SoccerStats ML</h1>
            </div>
            <div id="syncBadge" class="px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800/60 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Firebase Ready
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 my-2">
        
        <!-- SEZIONE PALINSESTO -->
        <section id="sec-palinsesto" class="space-y-6">
            <div class="bg-slate-900/60 border border-slate-800/80 p-6 rounded-3xl shadow-2xl backdrop-blur-xl max-w-2xl mx-auto">
                <h2 class="text-xs font-bold tracking-widest text-blue-400 uppercase mb-2 flex items-center gap-2">
                    ESTRAZIONE E CALCOLO PALINSESTO
                </h2>
                
                <p class="text-xs text-slate-400 mb-5">
                    Interroga i 12 campionati principali, scarica le classifiche e calcola le metriche avanzate (Medie Gol, Rendimento Casa/Trasferta, Forma e Indici ML).
                </p>

                <button id="btnEstrai" onclick="sincronizzaPalinsesto()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    Estrai Partite e Calcola Metriche (prossimi 4 giorni)
                </button>

                <div id="stato" class="hidden mt-4 p-3 rounded-xl text-xs text-center border"></div>
            </div>

            <!-- CONTENITORE CARDS DOVE VENGONO MOSTRATE LE PARTITE -->
            <div id="risultati" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6"></div>
        </section>

    </main>

    <!-- FOOTER NAV -->
    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 p-2 max-w-lg w-[calc(100%-2rem)] z-50">
        <div class="bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-full p-1.5 shadow-2xl flex justify-between items-center">
            <button class="flex-1 py-2 px-3 rounded-full bg-blue-600 text-white text-xs font-semibold">Palinsesto</button>
            <button class="flex-1 py-2 px-3 rounded-full text-slate-400 text-xs font-semibold">Validazione</button>
            <button class="flex-1 py-2 px-3 rounded-full text-slate-400 text-xs font-semibold">Archivio</button>
            <button class="flex-1 py-2 px-3 rounded-full text-slate-400 text-xs font-semibold">ML Engine</button>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvZ6My0UlFyzAIMvKvWdNneQPajryjvsw",
            authDomain: "betting-pro-db.firebaseapp.com",
            projectId: "betting-pro-db",
            storageBucket: "betting-pro-db.firebasestorage.app",
            messagingSenderId: "157886609369",
            appId: "1:157886609369:web:565f3a44ec8d1dba3c8bc8"
        };
        firebase.initializeApp(firebaseConfig);

        const WORKER_URL = "https://betting-pro-api.mvmymail.workers.dev/";

        function formattaData(isoString) {
            if (!isoString) return "Data N.D.";
            const d = new Date(isoString);
            return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        function mostraStato(testo, tipo = 'info') {
            const stato = document.getElementById("stato");
            stato.classList.remove('hidden', 'bg-rose-950/80', 'border-rose-800', 'text-rose-300', 'bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300', 'bg-blue-950/80', 'border-blue-800', 'text-blue-300');
            
            if (tipo === 'error') stato.classList.add('bg-rose-950/80', 'border-rose-800', 'text-rose-300');
            else if (tipo === 'success') stato.classList.add('bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300');
            else stato.classList.add('bg-blue-950/80', 'border-blue-800', 'text-blue-300');

            stato.innerText = testo;
        }

        function mostraPartite(partite) {
            const risultati = document.getElementById("risultati");
            risultati.innerHTML = "";

            if (!partite || partite.length === 0) {
                risultati.innerHTML = `<div class="col-span-full text-center text-slate-400 text-sm py-8 bg-slate-900/40 rounded-2xl border border-slate-800">Nessuna partita trovata nei prossimi 4 giorni.</div>`;
                return;
            }

            partite.forEach(p => {
                const card = document.createElement("div");
                card.className = "bg-slate-900/70 border border-slate-800/90 rounded-3xl p-5 shadow-2xl flex flex-col justify-between hover:border-blue-500/50 transition";
                card.innerHTML = `
                    <div>
                        <!-- HEAD: Campionato, Giornata e Ora -->
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-800 pb-2.5">
                            <span class="font-bold text-blue-400 uppercase tracking-wider">${p.campionato} ${p.giornata ? `(G. ${p.giornata})` : ''}</span>
                            <span class="font-mono text-slate-300">${formattaData(p.dataOraUTC)}</span>
                        </div>

                        <!-- SQUADRE -->
                        <div class="grid grid-cols-2 gap-4 my-3">
                            <div class="space-y-1">
                                <div class="text-lg font-bold text-slate-100">${p.squadraCasa}</div>
                                <div class="text-xs text-emerald-400 font-medium flex items-center gap-2">
                                    <span>Casa</span>
                                    <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">Forma: ${p.formaCasa}</span>
                                </div>
                            </div>
                            <div class="space-y-1 text-right">
                                <div class="text-lg font-bold text-slate-100">${p.squadraOspite}</div>
                                <div class="text-xs text-indigo-400 font-medium flex items-center gap-2 justify-end">
                                    <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">Forma: ${p.formaOspite}</span>
                                    <span>Ospite</span>
                                </div>
                            </div>
                        </div>

                        <!-- TABELLA COMPARATIVA METRICHE GENERALE -->
                        <div class="bg-slate-950/60 rounded-2xl p-3 my-3 border border-slate-800/60 text-xs space-y-2">
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800/60 pb-1">Rendimento Generale</div>
                            <div class="flex justify-between text-slate-300">
                                <span>Classifica / Punti</span>
                                <span class="font-bold text-slate-100">${p.posizioneCasa}° (${p.puntiCasa} pt) vs ${p.posizioneOspite}° (${p.puntiOspite} pt)</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Partite Giocate</span>
                                <span class="font-semibold text-slate-200">${p.giocateCasa} vs ${p.giocateOspite}</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Totale Gol (Fatti / Subiti)</span>
                                <span class="font-semibold text-slate-200">${p.golFattiCasa}/${p.golSubitiCasa} vs ${p.golFattiOspite}/${p.golSubitiOspite}</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Diff. Reti</span>
                                <span class="font-semibold text-slate-200">${p.diffRetiCasa > 0 ? '+' : ''}${p.diffRetiCasa} vs ${p.diffRetiOspite > 0 ? '+' : ''}${p.diffRetiOspite}</span>
                            </div>
                        </div>

                        <!-- TABELLA COMPARATIVA CASA VS TRASFERTA -->
                        <div class="bg-slate-950/60 rounded-2xl p-3 my-3 border border-slate-800/60 text-xs space-y-2">
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800/60 pb-1">Specifico Casa / Trasferta</div>
                            <div class="flex justify-between text-slate-300">
                                <span>Punti (in Casa vs Trasferta)</span>
                                <span class="font-semibold text-slate-200">${p.puntiCasaInCasa} pt vs ${p.puntiOspiteInTrasferta} pt</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Gol Segnati (in Casa vs Trasferta)</span>
                                <span class="font-semibold text-slate-200">${p.golFattiCasaInCasa} vs ${p.golFattiOspiteInTrasferta}</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Gol Subiti (in Casa vs Trasferta)</span>
                                <span class="font-semibold text-slate-200">${p.golSubitiCasaInCasa} vs ${p.golSubitiOspiteInTrasferta}</span>
                            </div>
                        </div>

                        <!-- CALCOLI MEDIE & INDICATORI ML -->
                        <div class="grid grid-cols-3 gap-2 my-3 text-center">
                            <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                <div class="text-[9px] text-slate-400 uppercase font-semibold">Media Punti/G</div>
                                <div class="text-xs font-bold text-emerald-400 mt-0.5">${p.mediaPuntiCasa} | ${p.mediaPuntiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                <div class="text-[9px] text-slate-400 uppercase font-semibold">Media Gol Fatti</div>
                                <div class="text-xs font-bold text-blue-400 mt-0.5">${p.mediaGolFattiCasa} | ${p.mediaGolFattiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                <div class="text-[9px] text-slate-400 uppercase font-semibold">Indice Gol Attesi</div>
                                <div class="text-xs font-bold text-indigo-300 mt-0.5">${p.indiceGolAttesi}</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-3 flex justify-between items-center mt-3">
                        <span class="text-[10px] uppercase font-bold text-slate-400">Pronto per ML Engine</span>
                        <span class="text-xs font-bold text-emerald-400">Match ID: ${p.matchId}</span>
                    </div>
                `;
                risultati.appendChild(card);
            });
        }

        function sincronizzaPalinsesto() {
            const btn = document.getElementById("btnEstrai");
            const risultati = document.getElementById("risultati");

            btn.disabled = true;
            btn.textContent = "Estrazione & Calcolo in corso...";
            mostraStato("Attendere circa 2-2.5 minuti per la scansione completa di campionati, classifiche e calcolo metriche...", "info");
            risultati.innerHTML = "";

            fetch(WORKER_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.errore) {
                        mostraStato("Errore: " + (data.messaggio || "richiesta fallita"), "error");
                    } else {
                        mostraStato(`Completato! Trovate ${data.totalePartiteTrovate || (data.partite ? data.partite.length : 0)} partite elaborate con metriche avanzate.`, "success");
                        mostraPartite(data.partite || []);
                    }
                })
                .catch(e => {
                    console.error(e);
                    mostraStato("Errore di connessione: " + e.message, "error");
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = "Estrai Partite e Calcola Metriche (prossimi 4 giorni)";
                });
        }
    </script>
</body>
</html>
