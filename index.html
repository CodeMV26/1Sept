<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football & Odds Hub - 1Sept</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header / Navbar -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-emerald-500 text-slate-950 p-2 rounded-lg font-bold text-xl">⚽</div>
        <h1 class="text-xl font-bold tracking-tight">SoccerStats <span class="text-emerald-400">& Odds</span></h1>
      </div>
      <button onclick="fetchMatches()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition-all flex items-center gap-2">
        <span>🔄 Aggiorna Match</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 mt-8">
    
    <!-- Hero / Control Banner -->
    <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-2xl font-bold text-white mb-1">Partite in programma</h2>
        <p class="text-slate-400 text-sm">Mostra solo i match futuri non ancora disputati</p>
      </div>
      
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 w-full md:w-auto">
        <!-- Input Intervallo Temporale -->
        <label for="timeframe" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Intervallo:</label>
        <select id="timeframe" onchange="fetchMatches()" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-emerald-500 focus:border-emerald-500 block w-full sm:w-auto">
          <option value="0" selected>Solo Oggi</option>
          <option value="3">Prossimi 3 giorni</option>
          <option value="7">Prossimi 7 giorni</option>
          <option value="14">Prossimi 14 giorni</option>
        </select>

        <!-- Status Badge -->
        <div id="status-badge" class="inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 w-full sm:w-auto justify-center">
          <span>⏳ Caricamento dati...</span>
        </div>
      </div>
    </div>

    <!-- Contenitore Partite -->
    <div id="matches-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Le schede delle partite verranno inserite qui dinamicamente via JS -->
    </div>

  </main>

  <!-- Script Integrazione API -->
  <script>
    const API_KEY = "e0ca06c07c634d4fb0950365bd82ffd0";

    function getFormattedDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    async function fetchMatches() {
      const container = document.getElementById("matches-container");
      const badge = document.getElementById("status-badge");
      const daysAhead = parseInt(document.getElementById("timeframe").value, 10);

      const dateFrom = getFormattedDate(0);
      const dateTo = getFormattedDate(daysAhead);

      const TARGET_URL = `https://api.football-data.org/v4/matches?dateFrom=${dateFrom}&dateTo=${dateTo}`;
      const PROXY_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(TARGET_URL)}`;
      
      badge.className = "inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 w-full sm:w-auto justify-center";
      badge.innerHTML = "<span>⏳ Recupero match...</span>";

      try {
        const response = await fetch(PROXY_URL, {
          headers: { "X-Auth-Token": API_KEY }
        });

        if (!response.ok) {
          throw new Error(`Errore HTTP: ${response.status}`);
        }

        const wrapperData = await response.json();
        let data;
        try {
          data = typeof wrapperData.contents === 'string' ? JSON.parse(wrapperData.contents) : wrapperData.contents;
        } catch (e) {
          throw new Error("Impossibile decodificare i dati dell'API");
        }

        if (data.errorCode) {
          throw new Error(`API Error ${data.errorCode}: ${data.message}`);
        }

        const rawMatches = data.matches || [];
        const now = new Date();

        // FILTRO: Solo partite non ancora svolte (Stato SCHEDULED/TIMED e orario futuro)
        const upcomingMatches = rawMatches.filter(match => {
          const isScheduled = match.status === "SCHEDULED" || match.status === "TIMED";
          const isFuture = new Date(match.utcDate) > now;
          return isScheduled && isFuture;
        });

        badge.className = "inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 w-full sm:w-auto justify-center";
        badge.innerHTML = `<span>✅ ${upcomingMatches.length} Match futuri</span>`;

        renderMatches(upcomingMatches);

      } catch (error) {
        console.warn("Errore chiamata API live. Utilizzo dati di riserva:", error);
        
        badge.className = "inline-flex items-center gap-2 px-3 py-2 rounded-lg text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 w-full sm:w-auto justify-center";
        badge.innerHTML = `<span>⚠️ Modalità Demo</span>`;
        
        // Mock data di riserva per test grafico
        const mockNow = new Date();
        const mockMatches = [
          {
            id: 201,
            competition: { name: "Serie A" },
            utcDate: new Date(mockNow.getTime() + 3600000 * 4).toISOString(),
            homeTeam: { name: "Milan" },
            awayTeam: { name: "Atalanta" },
            status: "SCHEDULED"
          },
          {
            id: 202,
            competition: { name: "Premier League" },
            utcDate: new Date(mockNow.getTime() + 3600000 * 24).toISOString(),
            homeTeam: { name: "Liverpool" },
            awayTeam: { name: "Manchester City" },
            status: "SCHEDULED"
          }
        ];
        renderMatches(mockMatches);
      }
    }

    function renderMatches(matches) {
      const container = document.getElementById("matches-container");
      container.innerHTML = "";

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-slate-800/30 border border-slate-700/50 text-slate-400 p-8 rounded-xl text-center">
            Nessuna partita da disputare trovata nell'intervallo temporale selezionato.
          </div>
        `;
        return;
      }

      matches.forEach(match => {
        const matchDate = new Date(match.utcDate);
        const dateStr = matchDate.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
        const timeStr = matchDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const card = document.createElement("div");
        card.className = "bg-slate-800/80 border border-slate-700/60 rounded-xl p-5 hover:border-emerald-500/40 transition-all flex flex-col justify-between";
        
        card.innerHTML = `
          <div>
            <!-- Campionato, Data e Ora -->
            <div class="flex justify-between items-center text-xs text-slate-400 mb-4 pb-2 border-b border-slate-700/50">
              <span class="font-semibold text-emerald-400 uppercase tracking-wider">${match.competition ? match.competition.name : 'Match'}</span>
              <span class="bg-slate-900 px-2 py-1 rounded border border-slate-700 text-slate-300 font-medium">${dateStr} ore ${timeStr}</span>
            </div>

            <!-- Squadre -->
            <div class="space-y-3 mb-6">
              <div class="flex justify-between items-center">
                <span class="font-semibold text-white text-lg">${match.homeTeam.name}</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="font-semibold text-white text-lg">${match.awayTeam.name}</span>
              </div>
            </div>
          </div>

          <!-- Sezione Quote (Mock-up UI per fase 2) -->
          <div class="pt-3 border-t border-slate-700/50">
            <div class="text-[10px] uppercase tracking-wider text-slate-500 font-bold mb-2">Quote 1X2 (In attesa di The Odds API)</div>
            <div class="grid grid-cols-3 gap-2 text-center text-xs font-semibold">
              <div class="bg-slate-900 hover:bg-slate-700 p-2 rounded border border-slate-700 cursor-pointer transition-colors">
                <span class="block text-slate-400 text-[10px]">1</span>
                <span class="text-emerald-400">--</span>
              </div>
              <div class="bg-slate-900 hover:bg-slate-700 p-2 rounded border border-slate-700 cursor-pointer transition-colors">
                <span class="block text-slate-400 text-[10px]">X</span>
                <span class="text-emerald-400">--</span>
              </div>
              <div class="bg-slate-900 hover:bg-slate-700 p-2 rounded border border-slate-700 cursor-pointer transition-colors">
                <span class="block text-slate-400 text-[10px]">2</span>
                <span class="text-emerald-400">--</span>
              </div>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    // Esegui la prima ricerca al caricamento
    fetchMatches();
  </script>
</body>
</html>
