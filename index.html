<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white font-sans antialiased pb-24">

    <!-- HEADER INVARIATO -->
    <header class="p-4 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">SoccerStats ML</h1>
            </div>
            <div id="syncBadge" class="px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800/60 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Sync
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 my-2">
        
        <!-- PANNELLO DI CONTROLLO CONSERVATO ESATTAMENTE COME ALLEGATO -->
        <section id="sec-palinsesto" class="space-y-6">
            <div class="bg-slate-900/60 border border-slate-800/80 p-5 rounded-3xl shadow-2xl backdrop-blur-xl max-w-2xl mx-auto">
                <h2 class="text-xs font-bold tracking-widest text-blue-400 uppercase mb-2 flex items-center gap-2">
                    ESTRAZIONE &amp; SINCRONIZZAZIONE PALINSESTO
                </h2>
                
                <p class="text-xs text-slate-400 mb-4">
                    Seleziona l'intervallo temporale delle partite da analizzare:
                </p>

                <!-- SELETTORE RANGE DATE -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Inizio</label>
                        <input type="date" id="dateFrom" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Fine</label>
                        <input type="date" id="dateTo" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <button id="btnEstrai" onclick="sincronizzaESalva()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    Estrai Partite e Sincronizza Cloud
                </button>

                <div id="stato" class="hidden mt-4 p-3 rounded-xl text-xs text-center border"></div>
            </div>

            <!-- CONTENITORE CARDS CON DATI GRANULARI AGGIUNTI -->
            <div id="risultati" class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mt-6"></div>
        </section>

    </main>

    <!-- FOOTER NAV -->
    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 p-2 max-w-lg w-[calc(100%-2rem)] z-50">
        <div class="bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-full p-1.5 shadow-2xl flex justify-between items-center text-center">
            <button class="flex-1 py-2 px-2 rounded-full bg-blue-600 text-white text-xs font-semibold truncate">Palinsesto</button>
            <button class="flex-1 py-2 px-2 rounded-full text-slate-400 text-xs font-semibold truncate">Validazione</button>
            <button class="flex-1 py-2 px-2 rounded-full text-slate-400 text-xs font-semibold truncate">Archivio</button>
            <button class="flex-1 py-2 px-2 rounded-full text-slate-400 text-xs font-semibold truncate">ML Engine</button>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvZ6My0UlFyzAIMvKvWdNneQPajryjvsw",
            authDomain: "betting-pro-db.firebaseapp.com",
            projectId: "betting-pro-db",
            storageBucket: "betting-pro-db.firebasestorage.app",
            messagingSenderId: "157886609369",
            appId: "1:157886609369:web:565f3a44ec8d1dba3c8bc8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const WORKER_URL = "https://betting-pro-api.mvmymail.workers.dev/";

        window.onload = function() {
            const oggi = new Date();
            const futuro = new Date();
            futuro.setDate(oggi.getDate() + 14);

            document.getElementById("dateFrom").value = oggi.toISOString().split("T")[0];
            document.getElementById("dateTo").value = futuro.toISOString().split("T")[0];

            db.collection("palinsesto").doc("corrente").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.partite && data.partite.length > 0) {
                        mostraPartite(data.partite);
                        mostraStato(`Sincronizzato Cloud: ${data.partite.length} partite (${data.intervallo || 'intervallo personalizzato'}) - Aggiornato: ${data.ultimoAggiornamento}`, "success");
                    }
                }
            });
        };

        function formattaData(isoString) {
            if (!isoString) return "N.D.";
            const d = new Date(isoString);
            return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        function calcolaIndiceForma(strForma) {
            if (!strForma || typeof strForma !== "string" || strForma.trim() === "") {
                return { simboli: "N/D", punteggio: "N/D" };
            }
            
            const esiti = strForma.includes(",") ? strForma.split(",").map(e => e.trim()) : strForma.split("");
            let p = 0;
            let sim = "";
            
            esiti.forEach(e => {
                if (e === "W") { p += 1.0; sim += "🟩 "; }
                else if (e === "D") { p += 0.5; sim += "🟨 "; }
                else if (e === "L") { p += 0.0; sim += "🟥 "; }
            });

            return {
                simboli: sim.trim() || "N/D",
                punteggio: p.toFixed(1) + " / " + esiti.length + ".0"
            };
        }

        function mostraStato(testo, tipo = 'info') {
            const stato = document.getElementById("stato");
            stato.classList.remove('hidden', 'bg-rose-950/80', 'border-rose-800', 'text-rose-300', 'bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300', 'bg-blue-950/80', 'border-blue-800', 'text-blue-300');
            
            if (tipo === 'error') stato.classList.add('bg-rose-950/80', 'border-rose-800', 'text-rose-300');
            else if (tipo === 'success') stato.classList.add('bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300');
            else stato.classList.add('bg-blue-950/80', 'border-blue-800', 'text-blue-300');

            stato.innerText = testo;
        }

        function mostraPartite(partite) {
            const risultati = document.getElementById("risultati");
            risultati.innerHTML = "";

            if (!partite || partite.length === 0) {
                risultati.innerHTML = `<div class="col-span-full text-center text-slate-400 text-sm py-8 bg-slate-900/40 rounded-2xl border border-slate-800">Nessuna partita trovata nell'intervallo selezionato.</div>`;
                return;
            }

            partite.forEach(p => {
                const formaCasaObj = calcolaIndiceForma(p.formaCasa);
                const formaOspiteObj = calcolaIndiceForma(p.formaOspite);

                const card = document.createElement("div");
                card.className = "bg-slate-900/70 border border-slate-800/90 rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col justify-between hover:border-blue-500/50 transition";
                card.innerHTML = `
                    <div>
                        <!-- HEAD -->
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-800 pb-2.5">
                            <span class="font-bold text-blue-400 uppercase tracking-wider truncate max-w-[60%]">${p.campionato} ${p.giornata ? `(G.${p.giornata})` : ''}</span>
                            <span class="font-mono text-slate-300 text-[11px]">${formattaData(p.dataOraUTC)}</span>
                        </div>

                        <!-- SQUADRE CON FORMA -->
                        <div class="grid grid-cols-2 gap-2 my-3 items-start">
                            <div class="space-y-1 min-w-0">
                                <div class="text-sm sm:text-base font-bold text-slate-100 truncate">${p.squadraCasa}</div>
                                <div class="text-[11px] text-emerald-400 font-medium">Casa</div>
                                <div class="text-[10px] text-slate-300 bg-slate-950 px-2 py-1 rounded border border-slate-800 mt-1 inline-block">
                                    <div>${formaCasaObj.simboli}</div>
                                    <div class="text-[9px] text-slate-400 mt-0.5">${formaCasaObj.punteggio}</div>
                                </div>
                            </div>
                            <div class="space-y-1 text-right min-w-0">
                                <div class="text-sm sm:text-base font-bold text-slate-100 truncate">${p.squadraOspite}</div>
                                <div class="text-[11px] text-indigo-400 font-medium">Ospite</div>
                                <div class="text-[10px] text-slate-300 bg-slate-950 px-2 py-1 rounded border border-slate-800 mt-1 inline-block">
                                    <div>${formaOspiteObj.simboli}</div>
                                    <div class="text-[9px] text-slate-400 mt-0.5">${formaOspiteObj.punteggio}</div>
                                </div>
                            </div>
                        </div>

                        <!-- RENDIMENTO GENERALE (CON V / P / S) -->
                        <div class="bg-slate-950/60 rounded-2xl p-3 my-3 border border-slate-800/60 text-xs space-y-1.5">
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800/60 pb-1">Rendimento Generale</div>
                            <div class="flex justify-between text-slate-300">
                                <span>Posizione (Punti)</span>
                                <span class="font-bold text-slate-100">${p.posizioneCasa}° (${p.puntiCasa}pt) vs ${p.posizioneOspite}° (${p.puntiOspite}pt)</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Partite Giocate</span>
                                <span class="font-semibold text-slate-200">${p.giocateCasa} vs ${p.giocateOspite}</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>V / P / S Generali</span>
                                <span class="font-semibold text-slate-200">${p.vinteCasa}-${p.pareggiateCasa}-${p.persoCasa} vs ${p.vinteOspite}-${p.pareggiateOspite}-${p.persoOspite}</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Gol Fatti / Subiti</span>
                                <span class="font-semibold text-slate-200">${p.golFattiCasa}/${p.golSubitiCasa} vs ${p.golFattiOspite}/${p.golSubitiOspite}</span>
                            </div>
                        </div>

                        <!-- SPECIFICO CASA VS TRASFERTA (CON V / P / S SPECIFICI) -->
                        <div class="bg-slate-950/60 rounded-2xl p-3 my-3 border border-slate-800/60 text-xs space-y-1.5">
                            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800/60 pb-1">Casa vs Trasferta Specifico</div>
                            <div class="flex justify-between text-slate-300">
                                <span>Partite Specifiche</span>
                                <span class="font-semibold text-slate-200">${p.giocateCasaInCasa} in casa vs ${p.giocateOspiteInTrasferta} in trasf.</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Punti Specifici</span>
                                <span class="font-semibold text-slate-200">${p.puntiCasaInCasa} pt vs ${p.puntiOspiteInTrasferta} pt</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>V / P / S Specifico</span>
                                <span class="font-semibold text-slate-200">${p.vinteCasaInCasa}-${p.pareggiateCasaInCasa}-${p.persoCasaInCasa} vs ${p.vinteOspiteInTrasferta}-${p.pareggiateOspiteInTrasferta}-${p.persoOspiteInTrasferta}</span>
                            </div>
                            <div class="flex justify-between text-slate-300">
                                <span>Gol Segnati / Subiti</span>
                                <span class="font-semibold text-slate-200">${p.golFattiCasaInCasa}/${p.golSubitiCasaInCasa} vs ${p.golFattiOspiteInTrasferta}/${p.golSubitiOspiteInTrasferta}</span>
                            </div>
                        </div>

                        <!-- CALCOLI MEDIE -->
                        <div class="grid grid-cols-3 gap-1.5 my-3 text-center">
                            <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                <div class="text-[8px] sm:text-[9px] text-slate-400 uppercase font-semibold">Media Punti</div>
                                <div class="text-xs font-bold text-emerald-400 mt-0.5">${p.mediaPuntiCasa} | ${p.mediaPuntiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                <div class="text-[8px] sm:text-[9px] text-slate-400 uppercase font-semibold">Media Gol</div>
                                <div class="text-xs font-bold text-blue-400 mt-0.5">${p.mediaGolFattiCasa} | ${p.mediaGolFattiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-2 rounded-xl">
                                <div class="text-[8px] sm:text-[9px] text-slate-400 uppercase font-semibold">Gol Attesi</div>
                                <div class="text-xs font-bold text-indigo-300 mt-0.5">${p.indiceGolAttesi}</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-2.5 flex justify-between items-center mt-2">
                        <span class="text-[10px] uppercase font-bold text-slate-400">ID Partita</span>
                        <span class="text-xs font-bold text-emerald-400">#${p.matchId}</span>
                    </div>
                `;
                risultati.appendChild(card);
            });
        }

        async function sincronizzaESalva() {
            const btn = document.getElementById("btnEstrai");
            const dateFrom = document.getElementById("dateFrom").value;
            const dateTo = document.getElementById("dateTo").value;

            if (!dateFrom || !dateTo) {
                alert("Seleziona entrambe le date!");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Estrazione & Sincronizzazione...";
            mostraStato(`Estrazione in corso dal ${dateFrom} al ${dateTo}...`, "info");

            try {
                const fullUrl = `${WORKER_URL}?dateFrom=${dateFrom}&dateTo=${dateTo}`;
                const res = await fetch(fullUrl);
                const data = await res.json();

                if (data.errore) {
                    mostraStato("Errore Worker: " + data.messaggio, "error");
                } else if (data.partite && data.partite.length > 0) {
                    const ora = new Date().toLocaleString("it-IT");
                    
                    await db.collection("palinsesto").doc("corrente").set({
                        partite: data.partite,
                        intervallo: `${dateFrom} / ${dateTo}`,
                        ultimoAggiornamento: ora,
                        totale: data.partite.length
                    });

                    mostraStato(`Completato! Trovate e sincronizzate ${data.partite.length} partite nell'intervallo selezionato.`, "success");
                } else {
                    mostraStato("Nessuna partita trovata nell'intervallo selezionato.", "error");
                }
            } catch (e) {
                console.error(e);
                mostraStato("Errore di connessione: " + e.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Estrai Partite e Sincronizza Cloud";
            }
        }
    </script>
</body>
</html>
