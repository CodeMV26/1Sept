<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Betting Pro Mobile (1Sept)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 16px;
            color: #1d1d1f;
        }
        .brand { text-align: center; margin-bottom: 16px; }
        .brand h1 { color: #0071e3; font-size: 20px; margin: 0; }
        .brand .versione { font-size: 11px; color: #86868b; margin-top: 2px; }
        button#btnEstrai {
            width: 100%;
            padding: 14px;
            background-color: #2cd158;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            cursor: pointer;
        }
        button#btnEstrai:disabled { background-color: #a5e8bb; cursor: not-allowed; }
        #stato { text-align: center; font-size: 13px; color: #86868b; margin-bottom: 12px; line-height: 1.4; }
        
        .box-riepilogo {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #e5e5ea;
            font-size: 12px;
        }
        .box-riepilogo h3 { margin: 0 0 8px 0; font-size: 13px; color: #0071e3; }
        .riepilogo-riga { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
        .riepilogo-riga:last-child { border-bottom: none; font-weight: bold; padding-top: 6px; }

        .match-card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e5e5ea;
        }
        .match-card .campionato { font-size: 10px; font-weight: 800; color: #007aff; text-transform: uppercase; margin-bottom: 4px; }
        .match-card .squadre { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .match-card .data { font-size: 11px; color: #86868b; margin-bottom: 8px; }
        .stat-riga { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-top: 1px solid #f0f0f0; }
        .stat-riga span:first-child { color: #8e8e93; }
        .stat-riga span:last-child { font-weight: 600; }
    </style>
</head>
<body>
    <div class="brand">
        <h1>⚽ Betting Pro Mobile</h1>
        <div class="versione">Versione 1Sept Multi-League Monitor</div>
    </div>

    <button id="btnEstrai">Estrai Partite (prossimi 4-5 giorni)</button>
    <div id="stato"></div>
    <div id="riepilogo"></div>
    <div id="risultati"></div>

    <script>
        var WORKER_URL = "https://betting-pro-1sept.mvmymail.workers.dev/";
        
        var btn = document.getElementById("btnEstrai");
        var stato = document.getElementById("stato");
        var riepilogo = document.getElementById("riepilogo");
        var risultati = document.getElementById("risultati");

        function formattaData(isoString) {
            if (!isoString) return "N/D";
            var d = new Date(isoString);
            return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        function mostraRiepilogo(resoconto, totale) {
            if (!resoconto || resoconto.length === 0) return;
            var html = "<div class='box-riepilogo'><h3>📊 Resoconto 12 Campionati Free</h3>";
            for (var i = 0; i < resoconto.length; i++) {
                var c = resoconto[i];
                var infoStato = c.stato !== "OK" ? " (" + c.stato + ")" : "";
                html += "<div class='riepilogo-riga'><span>" + c.nome + infoStato + ":</span><span>" + c.trovate + " partite</span></div>";
            }
            html += "<div class='riepilogo-riga'><span>TOTALE COMPLESSIVO:</span><span>" + totale + " partite</span></div></div>";
            riepilogo.innerHTML = html;
        }

        function mostraPartite(partite) {
            risultati.innerHTML = "";
            if (!partite || partite.length === 0) {
                risultati.innerHTML = "<p style='text-align:center; color:#86868b; font-size:13px;'>Nessuna partita trovata nei prossimi giorni.</p>";
                return;
            }
            for (var i = 0; i < partite.length; i++) {
                var p = partite[i];
                var card = document.createElement("div");
                card.className = "match-card";
                card.innerHTML = 
                    "<div class='campionato'>" + (p.campionato || "Campionato") + "</div>" +
                    "<div class='squadre'>" + p.squadraCasa + " - " + p.squadraOspite + "</div>" +
                    "<div class='data'>" + formattaData(p.dataOraUTC) + "</div>" +
                    "<div class='stat-riga'><span>Punti</span><span>" + p.puntiCasa + " vs " + p.puntiOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Posizione</span><span>" + p.posizioneCasa + " vs " + p.posizioneOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Partite giocate</span><span>" + p.giocateCasa + " vs " + p.giocateOspite + "</span></div>" +
                    "<div class='stat-riga'><span>V/P/S</span><span>" + p.vinteCasa + "/" + p.pareggiateCasa + "/" + p.perseCasa + " vs " + p.vinteOspite + "/" + p.pareggiateOspite + "/" + p.perseOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Gol fatti</span><span>" + p.golFattiCasa + " vs " + p.golFattiOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Gol subiti</span><span>" + p.golSubitiCasa + " vs " + p.golSubitiOspite + "</span></div>";
                risultati.appendChild(card);
            }
        }

        btn.addEventListener("click", function() {
            btn.disabled = true;
            btn.textContent = "Estrazione in corso...";
            stato.textContent = "Scansione in corso dei 12 campionati (può richiedere fino a 30-40 secondi)...";
            riepilogo.innerHTML = "";
            risultati.innerHTML = "";

            fetch(WORKER_URL)
                .then(function(response) {
                    if (!response.ok) throw new Error("Errore HTTP " + response.status);
                    return response.json();
                })
                .then(function(data) {
                    if (data.errore) {
                        stato.textContent = "Errore: " + (data.messaggio || "Richiesta fallita");
                    } else {
                        stato.textContent = "Estrazione completata!";
                        mostraRiepilogo(data.resocontoCampionati, data.totalePartiteTrovate);
                        mostraPartite(data.partite || []);
                    }
                })
                .catch(function(e) {
                    stato.textContent = "Errore di connessione: " + e.message;
                })
                .finally(function() {
                    btn.disabled = false;
                    btn.textContent = "Estrai Partite (prossimi 4-5 giorni)";
                });
        });
    </script>
</body>
</html>
