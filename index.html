<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white font-sans antialiased pb-28">

    <!-- C: GRAFICA PARTE INIZIALE CONSERVATA INTEGRA -->
    <header class="p-4 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">SoccerStats ML</h1>
            </div>
            <div id="syncBadge" class="px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800/60 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Sync
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 my-2">
        <section id="sec-palinsesto" class="space-y-6">
            <div class="bg-slate-900/60 border border-slate-800/80 p-4 sm:p-5 rounded-3xl shadow-2xl backdrop-blur-xl max-w-2xl mx-auto">
                <h2 class="text-xs font-bold tracking-widest text-blue-400 uppercase mb-2 flex items-center gap-2">
                    ESTRAZIONE &amp; SINCRONIZZAZIONE PALINSESTO
                </h2>
                
                <p class="text-xs text-slate-400 mb-4">
                    Seleziona l'intervallo temporale ed i campionati da analizzare:
                </p>

                <!-- B: INTERVALLO TEMPORALE CONSERVATO INTEGRALMENTE -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Inizio</label>
                        <input type="date" id="dateFrom" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Fine</label>
                        <input type="date" id="dateTo" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- FILTRO CAMPIONATI CON CHECKBOX MULTI-SELEZIONE (CODICI UFFICIALI FOOTBALL-DATA.ORG FREE TIER) -->
                <div class="mb-5 bg-slate-950/80 p-3 sm:p-4 rounded-2xl border border-slate-800/80">
                    <div class="flex justify-between items-center mb-2.5">
                        <label class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Campionati da Estrarre</label>
                        <button type="button" onclick="toggleTuttiCampionati()" class="text-[10px] text-blue-400 hover:text-blue-300 font-semibold underline">
                            Seleziona / Deseleziona Tutti
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="SA" checked>
                            <span class="text-slate-200 truncate"> Serie A</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="PL" checked>
                            <span class="text-slate-200 truncate"> Premier League</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="PD" checked>
                            <span class="text-slate-200 truncate"> La Liga</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="BL1" checked>
                            <span class="text-slate-200 truncate"> Bundesliga</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="FL1" checked>
                            <span class="text-slate-200 truncate"> Ligue 1</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="DED" checked>
                            <span class="text-slate-200 truncate"> Eredivisie</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="PPL" checked>
                            <span class="text-slate-200 truncate"> Liga Portugal</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="ELC" checked>
                            <span class="text-slate-200 truncate"> Championship</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="CL" checked>
                            <span class="text-slate-200 truncate"> Champions League</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="EC" checked>
                            <span class="text-slate-200 truncate"> Euro Championship</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="WC" checked>
                            <span class="text-slate-200 truncate"> World Cup</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="BSA" checked>
                            <span class="text-slate-200 truncate"> Brasileirão</span>
                        </label>
                    </div>
                </div>

                <button id="btnEstrai" type="button" onclick="sincronizzaESalva(event)" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    Estrai Partite e Sincronizza Cloud
                </button>

                <div id="stato" class="hidden mt-4 p-3 rounded-xl text-xs text-center border"></div>
            </div>

            <!-- D: GRID RESPONSIVE ANTI SCOMPAGINAMENTO CONSERVATA -->
            <div id="risultati" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mt-6"></div>
        </section>
    </main>

    <!-- A: SINCRONIZZAZIONE NAV BAR CONSERVATA -->
    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 p-2 max-w-lg w-[calc(100%-1.5rem)] z-50">
        <div class="bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-full p-1.5 shadow-2xl flex justify-between items-center text-center">
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full bg-blue-600 text-white text-[11px] sm:text-xs font-semibold truncate">Palinsesto</button>
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full text-slate-400 text-[11px] sm:text-xs font-semibold truncate">Validazione</button>
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full text-slate-400 text-[11px] sm:text-xs font-semibold truncate">Archivio</button>
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full text-slate-400 text-[11px] sm:text-xs font-semibold truncate">ML Engine</button>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvZ6My0UlFyzAIMvKvWdNneQPajryjvsw",
            authDomain: "betting-pro-db.firebaseapp.com",
            projectId: "betting-pro-db",
            storageBucket: "betting-pro-db.firebasestorage.app",
            messagingSenderId: "157886609369",
            appId: "1:157886609369:web:565f3a44ec8d1dba3c8bc8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const WORKER_URL = "https://betting-pro-api.mvmymail.workers.dev/";

        function formattaDataIso(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        window.onload = function() {
            const oggi = new Date();
            const futuro = new Date();
            futuro.setDate(oggi.getDate() + 14);

            document.getElementById("dateFrom").value = formattaDataIso(oggi);
            document.getElementById("dateTo").value = formattaDataIso(futuro);

            db.collection("palinsesto").doc("corrente").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.partite && data.partite.length > 0) {
                        mostraPartite(data.partite);
                        mostraStato(`Sincronizzato Cloud: ${data.partite.length} partite (${data.intervallo || 'intervallo personalizzato'}) - Aggiornato: ${data.ultimoAggiornamento}`, "success");
                    }
                }
            });
        };

        function toggleTuttiCampionati() {
            const checkboxes = document.querySelectorAll('.comp-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
        }

        function formattaData(isoString) {
            if (!isoString) return "N.D.";
            const d = new Date(isoString);
            return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        function calcolaIndiceForma(strForma) {
            if (!strForma || typeof strForma !== "string" || strForma.trim() === "") {
                return { simboli: "N/D", punteggio: "N/D" };
            }
            
            const esiti = strForma.includes(",") ? strForma.split(",").map(e => e.trim()) : strForma.split("");
            let p = 0;
            let sim = "";
            
            esiti.forEach(e => {
                if (e === "W") { p += 1.0; sim += " "; }
                else if (e === "D") { p += 0.5; sim += " "; }
                else if (e === "L") { p += 0.0; sim += " "; }
            });

            return {
                simboli: sim.trim() || "N/D",
                punteggio: p.toFixed(1) + " / " + esiti.length + ".0"
            };
        }

        function mostraStato(testo, tipo = 'info') {
            const stato = document.getElementById("stato");
            stato.classList.remove('hidden', 'bg-rose-950/80', 'border-rose-800', 'text-rose-300', 'bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300', 'bg-blue-950/80', 'border-blue-800', 'text-blue-300');
            
            if (tipo === 'error') stato.classList.add('bg-rose-950/80', 'border-rose-800', 'text-rose-300');
            else if (tipo === 'success') stato.classList.add('bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300');
            else stato.classList.add('bg-blue-950/80', 'border-blue-800', 'text-blue-300');

            stato.innerText = testo;
        }

        function mostraPartite(partite) {
            const risultati = document.getElementById("risultati");
            risultati.innerHTML = "";

            if (!partite || partite.length === 0) {
                risultati.innerHTML = `<div class="col-span-full text-center text-slate-400 text-sm py-8 bg-slate-900/40 rounded-2xl border border-slate-800">Nessuna partita trovata per la selezione corrente.</div>`;
                return;
            }

            partite.forEach(p => {
                const formaCasaObj = calcolaIndiceForma(p.formaCasa);
                const formaOspiteObj = calcolaIndiceForma(p.formaOspite);

                const card = document.createElement("div");
                card.className = "bg-slate-900/70 border border-slate-800/90 rounded-3xl p-3.5 sm:p-5 shadow-2xl flex flex-col justify-between hover:border-blue-500/50 transition w-full min-w-0";
                card.innerHTML = `
                    <div class="min-w-0">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-800 pb-2.5">
                            <span class="font-bold text-blue-400 uppercase tracking-wider truncate max-w-[55%] sm:max-w-[60%]">${p.campionato} ${p.giornata ? `(G.${p.giornata})` : ''}</span>
                            <span class="font-mono text-slate-300 text-[10px] sm:text-[11px] shrink-0">${formattaData(p.dataOraUTC)}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-2 my-3 items-start min-w-0">
                            <div class="space-y-1 min-w-0">
                                <div class="text-xs sm:text-base font-bold text-slate-100 truncate break-words">${p.squadraCasa}</div>
                                <div class="text-[10px] sm:text-[11px] text-emerald-400 font-medium">Casa</div>
                                <div class="text-[10px] text-slate-300 bg-slate-950 px-2 py-1 rounded border border-slate-800 mt-1 inline-block max-w-full overflow-hidden">
                                    <div class="truncate">${formaCasaObj.simboli}</div>
                                    <div class="text-[9px] text-slate-400 mt-0.5">${formaCasaObj.punteggio}</div>
                                </div>
                            </div>
                            <div class="space-y-1 text-right min-w-0">
                                <div class="text-xs sm:text-base font-bold text-slate-100 truncate break-words">${p.squadraOspite}</div>
                                <div class="text-[10px] sm:text-[11px] text-indigo-400 font-medium">Ospite</div>
                                <div class="text-[10px] text-slate-300 bg-slate-950 px-2 py-1 rounded border border-slate-800 mt-1 inline-block max-w-full overflow-hidden">
                                    <div class="truncate">${formaOspiteObj.simboli}</div>
                                    <div class="text-[9px] text-slate-400 mt-0.5">${formaOspiteObj.punteggio}</div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-950/60 rounded-2xl p-2.5 sm:p-3 my-3 border border-slate-800/60 text-[11px] sm:text-xs space-y-1.5 min-w-0">
                            <div class="text-[9px] sm:text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800/60 pb-1">Rendimento Generale</div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">Posizione (Punti)</span>
                                <span class="font-bold text-slate-100 text-right truncate">${p.posizioneCasa}° (${p.puntiCasa}pt) vs ${p.posizioneOspite}° (${p.puntiOspite}pt)</span>
                            </div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">Partite Giocate</span>
                                <span class="font-semibold text-slate-200 text-right">${p.giocateCasa} vs ${p.giocateOspite}</span>
                            </div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">V / P / S Generali</span>
                                <span class="font-semibold text-slate-200 text-right">${p.vinteCasa}-${p.pareggiateCasa}-${p.persoCasa} vs ${p.vinteOspite}-${p.pareggiateOspite}-${p.persoOspite}</span>
                            </div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">Gol Fatti / Subiti</span>
                                <span class="font-semibold text-slate-200 text-right">${p.golFattiCasa}/${p.golSubitiCasa} vs ${p.golFattiOspite}/${p.golSubitiOspite}</span>
                            </div>
                        </div>

                        <div class="bg-slate-950/60 rounded-2xl p-2.5 sm:p-3 my-3 border border-slate-800/60 text-[11px] sm:text-xs space-y-1.5 min-w-0">
                            <div class="text-[9px] sm:text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800/60 pb-1">Casa vs Trasferta Specifico</div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">Partite Specifiche</span>
                                <span class="font-semibold text-slate-200 text-right">${p.giocateCasaInCasa} in casa vs ${p.giocateOspiteInTrasferta} in trasf.</span>
                            </div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">Punti Specifici</span>
                                <span class="font-semibold text-slate-200 text-right">${p.puntiCasaInCasa} pt vs ${p.puntiOspiteInTrasferta} pt</span>
                            </div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">V / P / S Specifico</span>
                                <span class="font-semibold text-slate-200 text-right">${p.vinteCasaInCasa}-${p.pareggiateCasaInCasa}-${p.persoCasaInCasa} vs ${p.vinteOspiteInTrasferta}-${p.pareggiateOspiteInTrasferta}-${p.persoOspiteInTrasferta}</span>
                            </div>
                            <div class="flex justify-between items-center text-slate-300 gap-2">
                                <span class="shrink-0">Gol Segnati / Subiti</span>
                                <span class="font-semibold text-slate-200 text-right">${p.golFattiCasaInCasa}/${p.golSubitiCasaInCasa} vs ${p.golFattiOspiteInTrasferta}/${p.golSubitiOspiteInTrasferta}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-3 gap-1.5 my-3 text-center">
                            <div class="bg-slate-950 border border-slate-800 p-1.5 sm:p-2 rounded-xl">
                                <div class="text-[8px] sm:text-[9px] text-slate-400 uppercase font-semibold truncate">Media Punti</div>
                                <div class="text-[11px] sm:text-xs font-bold text-emerald-400 mt-0.5">${p.mediaPuntiCasa} | ${p.mediaPuntiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-1.5 sm:p-2 rounded-xl">
                                <div class="text-[8px] sm:text-[9px] text-slate-400 uppercase font-semibold truncate">Media Gol</div>
                                <div class="text-[11px] sm:text-xs font-bold text-blue-400 mt-0.5">${p.mediaGolFattiCasa} | ${p.mediaGolFattiOspite}</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-1.5 sm:p-2 rounded-xl">
                                <div class="text-[8px] sm:text-[9px] text-slate-400 uppercase font-semibold truncate">Gol Attesi</div>
                                <div class="text-[11px] sm:text-xs font-bold text-indigo-300 mt-0.5">${p.indiceGolAttesi}</div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-950/90 border border-slate-800 rounded-2xl p-2 sm:p-2.5 flex justify-between items-center mt-2">
                        <span class="text-[9px] sm:text-[10px] uppercase font-bold text-slate-400">ID Partita</span>
                        <span class="text-xs font-bold text-emerald-400">#${p.matchId}</span>
                    </div>
                `;
                risultati.appendChild(card);
            });
        }

        async function sincronizzaESalva(e) {
            if (e) e.preventDefault();

            const btn = document.getElementById("btnEstrai");
            const dateFrom = document.getElementById("dateFrom").value;
            const dateTo = document.getElementById("dateTo").value;

            if (!dateFrom || !dateTo) {
                alert("Seleziona entrambe le date!");
                return;
            }

            const selectedCheckboxes = document.querySelectorAll('.comp-checkbox:checked');
            const selectedComps = Array.from(selectedCheckboxes).map(cb => cb.value.trim());

            if (selectedComps.length === 0) {
                alert("Seleziona almeno un campionato da estrarre!");
                return;
            }

            btn.disabled = true;
            btn.textContent = "Estrazione in corso...";
            mostraStato(`Estrazione in corso per ${selectedComps.length} campionati selezionati...`, "info");

            try {
                const fullUrl = `${WORKER_URL}?dateFrom=${dateFrom}&dateTo=${dateTo}&competitions=${encodeURIComponent(selectedComps.join(","))}`;
                const res = await fetch(fullUrl);
                const data = await res.json();

                if (data.errore) {
                    mostraStato("Errore Worker: " + data.messaggio, "error");
                } else if (data.partite && data.partite.length > 0) {
                    const ora = new Date().toLocaleString("it-IT");
                    
                    await db.collection("palinsesto").doc("corrente").set({
                        partite: data.partite,
                        intervallo: `${dateFrom} / ${dateTo}`,
                        campionatiSelezionati: selectedComps,
                        ultimoAggiornamento: ora,
                        totale: data.partite.length
                    });

                    mostraStato(`Completato! Trovate e sincronizzate ${data.partite.length} partite per i campionati selezionati.`, "success");
                } else {
                    mostraStato("Nessuna partita trovata per i campionati e le date selezionate.", "error");
                }
            } catch (err) {
                console.error(err);
                mostraStato("Errore di connessione: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btn.textContent = "Estrai Partite e Sincronizza Cloud";
            }
        }
    </script>
</body>
</html>
