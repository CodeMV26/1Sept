<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoccerStats ML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white font-sans antialiased pb-28">

    <!-- HEADER -->
    <header class="p-4 border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                <h1 class="text-lg sm:text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">SoccerStats ML</h1>
            </div>
            <div id="syncBadge" class="px-3 py-1 bg-emerald-950/80 text-emerald-400 rounded-full text-xs font-semibold border border-emerald-800/60 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Sync
            </div>
        </div>
    </header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 my-2">
        <section id="sec-palinsesto" class="space-y-6">
            <div class="bg-slate-900/60 border border-slate-800/80 p-4 sm:p-5 rounded-3xl shadow-2xl backdrop-blur-xl max-w-2xl mx-auto">
                <h2 class="text-xs font-bold tracking-widest text-blue-400 uppercase mb-2 flex items-center gap-2">
                    ESTRAZIONE &amp; SINCRONIZZAZIONE PALINSESTO
                </h2>
                
                <p class="text-xs text-slate-400 mb-4">
                    Seleziona l'intervallo temporale ed i campionati da analizzare:
                </p>

                <!-- INPUT DATE -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Inizio</label>
                        <input type="date" id="dateFrom" onchange="ricalcolaDataFine(); aggiornaFiltriVisualizzazione();" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Giorni da Estrarre</label>
                        <input type="number" id="daysOffset" value="14" min="1" max="30" onchange="ricalcolaDataFine(); aggiornaFiltriVisualizzazione();" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Data Fine</label>
                        <input type="date" id="dateTo" onchange="aggiornaFiltriVisualizzazione()" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                </div>

                <!-- CHECKBOX CAMPIONATI -->
                <div class="mb-5 bg-slate-950/80 p-3 sm:p-4 rounded-2xl border border-slate-800/80">
                    <div class="flex justify-between items-center mb-2.5">
                        <label class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Campionati da Estrarre</label>
                        <button type="button" onclick="toggleTuttiCampionati()" class="text-[10px] text-blue-400 hover:text-blue-300 font-semibold underline">
                            Seleziona / Deseleziona Tutti
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs">
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="SA" checked>
                            <span class="text-slate-200 truncate"> Serie A</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="BSA" checked>
                            <span class="text-slate-200 truncate"> Brasileirão</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="PL" checked>
                            <span class="text-slate-200 truncate"> Premier League</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="PD" checked>
                            <span class="text-slate-200 truncate"> La Liga</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="BL1" checked>
                            <span class="text-slate-200 truncate"> Bundesliga</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="FL1" checked>
                            <span class="text-slate-200 truncate"> Ligue 1</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="DED" checked>
                            <span class="text-slate-200 truncate"> Eredivisie</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="PPL" checked>
                            <span class="text-slate-200 truncate"> Liga Portugal</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="ELC" checked>
                            <span class="text-slate-200 truncate"> Championship</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="CL" checked>
                            <span class="text-slate-200 truncate"> Champions League</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="EC" checked>
                            <span class="text-slate-200 truncate"> Euro Championship</span>
                        </label>
                        <label class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-slate-800/60 cursor-pointer hover:border-slate-700">
                            <input type="checkbox" onchange="aggiornaFiltriVisualizzazione()" class="comp-checkbox rounded border-slate-700 text-blue-600 focus:ring-0 bg-slate-950" value="WC" checked>
                            <span class="text-slate-200 truncate"> World Cup</span>
                        </label>
                    </div>
                </div>

                <button id="btnEstrai" type="button" onclick="sincronizzaESalva(event)" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold py-3.5 rounded-xl shadow-lg transition duration-200 text-sm cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    Estrai Partite e Sincronizza Cloud
                </button>

                <div id="stato" class="hidden mt-4 p-3 rounded-xl text-xs text-center border"></div>
            </div>

            <div id="risultati" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 mt-6"></div>
        </section>
    </main>

    <!-- FOOTER NAVIGATION -->
    <footer class="fixed bottom-4 left-1/2 -translate-x-1/2 p-2 max-w-lg w-[calc(100%-1.5rem)] z-50">
        <div class="bg-slate-900/90 border border-slate-800/90 backdrop-blur-2xl rounded-full p-1.5 shadow-2xl flex justify-between items-center text-center">
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full bg-blue-600 text-white text-[11px] sm:text-xs font-semibold truncate">Palinsesto</button>
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full text-slate-400 text-[11px] sm:text-xs font-semibold truncate">Validazione</button>
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full text-slate-400 text-[11px] sm:text-xs font-semibold truncate">Archivio</button>
            <button class="flex-1 py-2 px-1 sm:px-2 rounded-full text-slate-400 text-[11px] sm:text-xs font-semibold truncate">ML Engine</button>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDvZ6My0UlFyzAIMvKvWdNneQPajryjvsw",
            authDomain: "betting-pro-db.firebaseapp.com",
            projectId: "betting-pro-db",
            storageBucket: "betting-pro-db.firebasestorage.app",
            messagingSenderId: "157886609369",
            appId: "1:157886609369:web:565f3a44ec8d1dba3c8bc8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const WORKER_URL = "https://betting-pro-api.mvmymail.workers.dev/";
        let cachePartiteFirestore = [];

        function formattaDataIso(d) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function ricalcolaDataFine() {
            const valFrom = document.getElementById("dateFrom").value;
            const daysOffset = parseInt(document.getElementById("daysOffset").value) || 14;
            if (valFrom) {
                const parts = valFrom.split("-");
                const dInizio = new Date(parts[0], parts[1] - 1, parts[2]);
                dInizio.setDate(dInizio.getDate() + daysOffset);
                document.getElementById("dateTo").value = formattaDataIso(dInizio);
            }
        }

        window.onload = function() {
            const oggi = new Date();
            document.getElementById("dateFrom").value = formattaDataIso(oggi);
            ricalcolaDataFine();

            db.collection("palinsesto").doc("corrente").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.partite && Array.isArray(data.partite)) {
                        cachePartiteFirestore = data.partite;
                        aggiornaFiltriVisualizzazione();
                        mostraStato(`Sincronizzato Cloud: ${data.partite.length} partite in archivio - Ultimo aggiornamento: ${data.ultimoAggiornamento}`, "success");
                    }
                }
            });
        };

        function toggleTuttiCampionati() {
            const checkboxes = document.querySelectorAll('.comp-checkbox');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            aggiornaFiltriVisualizzazione();
        }

        function formattaData(isoString) {
            if (!isoString) return "N.D.";
            const d = new Date(isoString);
            if (isNaN(d.getTime())) return "N.D.";
            return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        function calcolaIndiceForma(strForma) {
            if (!strForma || typeof strForma !== "string" || strForma.trim() === "") {
                return {
                    simboliHtml: `<span class="text-slate-500 font-medium text-[10px]">N/D</span>`,
                    punteggio: "0.0 / 5.0"
                };
            }

            const pulita = strForma.replace(/,/g, "").trim().toUpperCase();
            const esiti = pulita.split("").slice(-5);
            let p = 0;
            let simboliHtml = `<div class="flex items-center gap-1 justify-center sm:justify-start">`;

            esiti.forEach(e => {
                if (e === "W" || e === "V") {
                    p += 1.0;
                    simboliHtml += `<span class="w-3.5 h-3.5 rounded-sm bg-emerald-500 inline-block shadow-sm" title="Vittoria (+1.0)"></span>`;
                } else if (e === "D" || e === "P") {
                    p += 0.5;
                    simboliHtml += `<span class="w-3.5 h-3.5 rounded-sm bg-amber-400 inline-block shadow-sm" title="Pareggio (+0.5)"></span>`;
                } else if (e === "L" || e === "S" || e === "N") {
                    p += 0.0;
                    simboliHtml += `<span class="w-3.5 h-3.5 rounded-sm bg-rose-500 inline-block shadow-sm" title="Sconfitta (+0.0)"></span>`;
                }
            });

            simboliHtml += `</div>`;

            return {
                simboliHtml: simboliHtml,
                punteggio: p.toFixed(1) + " / " + esiti.length + ".0"
            };
        }

        function formattaStatoApi(statoApi) {
            if (!statoApi) return `<span class="bg-slate-800 text-slate-300 text-[10px] font-semibold px-2 py-0.5 rounded-md border border-slate-700">TIMED</span>`;
            
            const st = statoApi.toUpperCase();
            if (st === "IN_PLAY" || st === "PAUSED" || st === "LIVE") {
                return `<span class="bg-emerald-950 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-md border border-emerald-700 animate-pulse">${st}</span>`;
            } else if (st === "FINISHED" || st === "AWARDED") {
                return `<span class="bg-slate-800 text-slate-400 text-[10px] font-semibold px-2 py-0.5 rounded-md border border-slate-700">${st}</span>`;
            } else {
                return `<span class="bg-blue-950 text-blue-300 text-[10px] font-semibold px-2 py-0.5 rounded-md border border-blue-800">${st}</span>`;
            }
        }

        function mostraStato(testo, tipo = 'info') {
            const stato = document.getElementById("stato");
            stato.classList.remove('hidden', 'bg-rose-950/80', 'border-rose-800', 'text-rose-300', 'bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300', 'bg-blue-950/80', 'border-blue-800', 'text-blue-300');
            
            if (tipo === 'error') stato.classList.add('bg-rose-950/80', 'border-rose-800', 'text-rose-300');
            else if (tipo === 'success') stato.classList.add('bg-emerald-950/80', 'border-emerald-800', 'text-emerald-300');
            else stato.classList.add('bg-blue-950/80', 'border-blue-800', 'text-blue-300');

            stato.innerText = testo;
        }

        async function sincronizzaESalva(e) {
            if (e) e.preventDefault();
            const btn = document.getElementById("btnEstrai");
            btn.disabled = true;
            mostraStato("Estrazione dati in corso per tutti i campionati...", "info");

            const dateFrom = document.getElementById("dateFrom").value;
            const dateTo = document.getElementById("dateTo").value;

            try {
                const response = await fetch(`${WORKER_URL}?dateFrom=${dateFrom}&dateTo=${dateTo}`);
                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                const matches = data.matches || [];
                if (matches.length === 0) {
                    throw new Error("L'API non ha restituito alcuna partita per le date e competizioni selezionate.");
                }

                const partiteMappate = matches.map(m => {
                    const homeGoals = m.score?.fullTime?.home;
                    const awayGoals = m.score?.fullTime?.away;
                    const risultatoReale = (homeGoals !== null && awayGoals !== null && homeGoals !== undefined && awayGoals !== undefined) 
                        ? `${homeGoals}-${awayGoals}` 
                        : "";

                    return {
                        matchId: m.id,
                        campionato: m.competition?.name || "N.D.",
                        campionatoCode: m.competition?.code || "",
                        giornata: m.matchday || "",
                        squadraCasa: m.homeTeam?.name || "N.D.",
                        squadraOspite: m.awayTeam?.name || "N.D.",
                        dataOraUTC: m.utcDate,
                        stato: m.status,
                        risultatoReale: risultatoReale,
                        formaCasa: m.homeTeam?.form || "",
                        formaOspite: m.awayTeam?.form || "",
                        topScorerCasa: m.topScorerCasa || "N.D.",
                        topScorerOspite: m.topScorerOspite || "N.D.",
                        topAssistCasa: m.topAssistCasa || "N.D.",
                        topAssistOspite: m.topAssistOspite || "N.D.",
                        xgCasa: m.xgCasa || "N.D.",
                        xgOspite: m.xgOspite || "N.D."
                    };
                });

                const payload = {
                    ultimoAggiornamento: new Date().toLocaleString("it-IT"),
                    partite: partiteMappate
                };

                await db.collection("palinsesto").doc("corrente").set(payload);
                mostraStato(`Sincronizzazione completata! ${partiteMappate.length} partite totali importate nel Cloud.`, "success");
            } catch (err) {
                console.error(err);
                mostraStato(`Errore durante la sincronizzazione: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
            }
        }

        function aggiornaFiltriVisualizzazione() {
            if (!cachePartiteFirestore || cachePartiteFirestore.length === 0) return;
            mostraPartite(cachePartiteFirestore);
        }

        function mostraPartite(partite) {
            const risultati = document.getElementById("risultati");
            risultati.innerHTML = "";

            const valFrom = document.getElementById("dateFrom").value;
            const valTo = document.getElementById("dateTo").value;

            const selectedCheckboxes = document.querySelectorAll('.comp-checkbox:checked');
            const selectedCodes = Array.from(selectedCheckboxes).map(cb => cb.value.trim().toUpperCase());

            const compMapping = {
                "SA": ["SERIE A", "SA"],
                "BSA": ["BRASILEIRÃO", "BRASILEIRAO", "SERIE A BRAZIL", "BSA"],
                "PL": ["PREMIER LEAGUE", "PL"],
                "PD": ["LA LIGA", "PRIMERA DIVISION", "PD"],
                "BL1": ["BUNDESLIGA", "BL1"],
                "FL1": ["LIGUE 1", "FL1"],
                "DED": ["EREDIVISIE", "DED"],
                "PPL": ["LIGA PORTUGAL", "PPL", "PRIMEIRA LIGA"],
                "ELC": ["CHAMPIONSHIP", "ELC"],
                "CL": ["CHAMPIONS LEAGUE", "UEFA CHAMPIONS LEAGUE", "CL"],
                "EC": ["EURO CHAMPIONSHIP", "EUROPEAN CHAMPIONSHIP", "EC"],
                "WC": ["WORLD CUP", "WC"]
            };

            let allowedKeywords = [];
            selectedCodes.forEach(code => {
                if (compMapping[code]) {
                    allowedKeywords.push(...compMapping[code]);
                } else {
                    allowedKeywords.push(code);
                }
            });

            const partiteFiltrate = (partite || []).filter(p => {
                const rawDate = p.dataOraUTC || p.utcDate || p.dataOra || "";
                let dataPartitaIso = "";
                if (rawDate) {
                    dataPartitaIso = rawDate.split("T")[0];
                }

                let dentroIntervalloDate = true;
                if (valFrom && dataPartitaIso) {
                    dentroIntervalloDate = dentroIntervalloDate && (dataPartitaIso >= valFrom);
                }
                if (valTo && dataPartitaIso) {
                    dentroIntervalloDate = dentroIntervalloDate && (dataPartitaIso <= valTo);
                }

                const nomeCamp = (p.campionato || "").toUpperCase();
                const codeCamp = (p.campionatoCode || "").toUpperCase();

                let campionatoMatch = false;
                if (selectedCodes.length === 0) {
                    campionatoMatch = false;
                } else {
                    campionatoMatch = allowedKeywords.some(kw => nomeCamp.includes(kw) || codeCamp.includes(kw) || kw.includes(nomeCamp));
                }

                return dentroIntervalloDate && campionatoMatch;
            });

            if (!partiteFiltrate || partiteFiltrate.length === 0) {
                risultati.innerHTML = `<div class="col-span-full text-center text-slate-400 text-sm py-8 bg-slate-900/40 rounded-2xl border border-slate-800">Nessuna partita trovata per i filtri temporali e campionati selezionati.</div>`;
                return;
            }

            partiteFiltrate.forEach(p => {
                const formaCasaObj = calcolaIndiceForma(p.formaCasa);
                const formaOspiteObj = calcolaIndiceForma(p.formaOspite);
                
                const dataDisplay = p.dataOraUTC || p.utcDate || p.dataOra;
                const risultatoRealeAutomatico = p.risultatoReale || "";

                const card = document.createElement("div");
                card.className = "bg-slate-900/70 border border-slate-800/90 rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col justify-between hover:border-blue-500/50 transition w-full min-w-0";
                card.innerHTML = `
                    <div class="min-w-0">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-3 border-b border-slate-800 pb-2.5">
                            <span class="font-bold text-slate-200 uppercase tracking-wider truncate max-w-[55%] sm:max-w-[60%] bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700/50">${p.campionato} ${p.giornata ? `(G.${p.giornata})` : ''}</span>
                            <div class="flex items-center gap-2">
                                <span class="font-mono text-slate-300 text-[10px] sm:text-[11px] shrink-0"> ${formattaData(dataDisplay)}</span>
                                ${formattaStatoApi(p.stato)}
                            </div>
                        </div>

                        <div class="my-3 text-base sm:text-lg font-bold text-slate-100 flex items-center justify-between gap-2">
                            <span class="truncate text-left flex-1">${p.squadraCasa}</span>
                            
                            <div class="flex flex-col items-center justify-center shrink-0 px-3 py-1 bg-slate-950 border border-emerald-500/50 rounded-xl min-w-[75px]">
                                ${risultatoRealeAutomatico ? 
                                    `<span class="text-emerald-400 font-extrabold text-lg tracking-widest">${risultatoRealeAutomatico}</span>` : 
                                    `<span class="text-xs text-slate-500 font-normal">vs</span>`
                                }
                            </div>

                            <span class="truncate text-right flex-1">${p.squadraOspite}</span>
                        </div>

                        <div class="bg-slate-950/70 rounded-2xl p-3 border border-slate-800/80 text-xs space-y-2 my-3">
                            <div class="grid grid-cols-3 text-slate-200 py-1.5 items-center border-slate-800/80 bg-slate-900/50 -mx-3 px-3 rounded-b-xl">
                                <div class="text-indigo-300 font-bold">Indice Forma</div>
                                <div class="text-center flex flex-col items-center justify-center gap-0.5">
                                    <span class="font-bold text-emerald-400">${formaCasaObj.punteggio}</span>
                                    ${formaCasaObj.simboliHtml}
                                </div>
                                <div class="text-right flex flex-col items-end justify-center gap-0.5">
                                    <span class="font-bold text-emerald-400">${formaOspiteObj.punteggio}</span>
                                    ${formaOspiteObj.simboliHtml}
                                </div>
                            </div>
                        </div>

                        <!-- TOP SCORER, ASSIST & METRICHE -->
                        <div class="bg-slate-950/50 border border-slate-800/60 rounded-xl p-2.5 my-2 space-y-2 text-xs">
                            <div class="flex justify-between items-center border-b border-slate-800/50 pb-1.5">
                                <div class="truncate max-w-[48%]">
                                    <span class="text-[9px] text-slate-400 block uppercase font-semibold">Top Scorer Casa</span>
                                    <span class="text-emerald-400 font-bold truncate block">${p.topScorerCasa || "N.D."}</span>
                                    <span class="text-[9px] text-slate-400 block uppercase font-semibold mt-1">Top Assist Casa</span>
                                    <span class="text-indigo-400 font-bold truncate block">${p.topAssistCasa || "N.D."}</span>
                                </div>
                                <div class="text-right truncate max-w-[48%]">
                                    <span class="text-[9px] text-slate-400 block uppercase font-semibold">Top Scorer Ospite</span>
                                    <span class="text-emerald-400 font-bold truncate block">${p.topScorerOspite || "N.D."}</span>
                                    <span class="text-[9px] text-slate-400 block uppercase font-semibold mt-1">Top Assist Ospite</span>
                                    <span class="text-indigo-400 font-bold truncate block">${p.topAssistOspite || "N.D."}</span>
                                </div>
                            </div>
                            
                            <div class="flex justify-between items-center text-[10px] text-slate-400 pt-0.5">
                                <span>xG stimato Casa: <strong class="text-slate-200">${p.xgCasa || "N.D."}</strong></span>
                                <span>xG stimato Ospite: <strong class="text-slate-200">${p.xgOspite || "N.D."}</strong></span>
                            </div>
                        </div>
                    </div>
                `;
                risultati.appendChild(card);
            });
        }
    </script>
</body>
