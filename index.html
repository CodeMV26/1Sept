<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Betting Pro Mobile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            padding: 16px;
            color: #1d1d1f;
        }
        .brand { text-align: center; margin-bottom: 16px; }
        .brand h1 { color: #0071e3; font-size: 20px; margin: 0; }
        .brand .versione { font-size: 11px; color: #86868b; margin-top: 2px; }
        button#btnEstrai {
            width: 100%;
            padding: 14px;
            background-color: #2cd158;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            cursor: pointer;
        }
        button#btnEstrai:disabled { background-color: #a5e8bb; cursor: not-allowed; }
        #stato { text-align: center; font-size: 13px; color: #86868b; margin-bottom: 12px; line-height: 1.4; }
        .match-card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #e5e5ea;
        }
        .match-card .campionato { font-size: 10px; font-weight: 800; color: #007aff; text-transform: uppercase; margin-bottom: 4px; }
        .match-card .squadre { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        .match-card .data { font-size: 11px; color: #86868b; margin-bottom: 8px; }
        .stat-riga { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-top: 1px solid #f0f0f0; }
        .stat-riga span:first-child { color: #8e8e93; }
        .stat-riga span:last-child { font-weight: 600; }
    </style>
</head>
<body>
    <div class="brand">
        <h1>⚽ Betting Pro Mobile</h1>
        <div class="versione">Versione 0.49 (Direct API)</div>
    </div>

    <button id="btnEstrai">Estrai Partite (prossimi 4 giorni)</button>
    <div id="stato"></div>
    <div id="risultati"></div>

    <script>
        const API_KEY = "e0ca06c07c634d4fb0950365bd82ffd0";
        const CAMPIONATI = ["SA", "PL", "PD", "BL1", "FL1", "CL", "DED", "PPL", "BSA", "ELC", "CLI", "WC"];
        
        var btn = document.getElementById("btnEstrai");
        var stato = document.getElementById("stato");
        var risultati = document.getElementById("risultati");

        const delay = ms => new Promise(res => setTimeout(res, ms));

        function formattaData(isoString) {
            if (!isoString) return "N/D";
            var d = new Date(isoString);
            return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        }

        function mostraPartite(partite) {
            risultati.innerHTML = "";
            if (!partite || partite.length === 0) {
                risultati.innerHTML = "<p style='text-align:center; color:#86868b; font-size:13px;'>Nessuna partita trovata nei prossimi 4 giorni.</p>";
                return;
            }
            for (var i = 0; i < partite.length; i++) {
                var p = partite[i];
                var card = document.createElement("div");
                card.className = "match-card";
                card.innerHTML = 
                    "<div class='campionato'>" + p.campionato + "</div>" +
                    "<div class='squadre'>" + p.squadraCasa + " - " + p.squadraOspite + "</div>" +
                    "<div class='data'>" + formattaData(p.dataOraUTC) + "</div>" +
                    "<div class='stat-riga'><span>Punti</span><span>" + p.puntiCasa + " vs " + p.puntiOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Posizione</span><span>" + p.posizioneCasa + " vs " + p.posizioneOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Partite giocate</span><span>" + p.giocateCasa + " vs " + p.giocateOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Gol fatti</span><span>" + p.golFattiCasa + " vs " + p.golFattiOspite + "</span></div>" +
                    "<div class='stat-riga'><span>Gol subiti</span><span>" + p.golSubitiCasa + " vs " + p.golSubitiOspite + "</span></div>";
                risultati.appendChild(card);
            }
        }

        async function fetchAPI(endpoint) {
            const targetUrl = 'https://api.football-data.org/v4/' + endpoint;
            // Utilizzo di proxy alternativo più stabile per chiamate REST
            const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);
            
            try {
                const res = await fetch(proxyUrl, {
                    headers: { "X-Auth-Token": API_KEY }
                });
                if (!res.ok) return null;
                const wrapper = await res.json();
                if (!wrapper.contents) return null;
                return JSON.parse(wrapper.contents);
            } catch (e) {
                console.error("Errore fetch:", e);
                return null;
            }
        }

        btn.addEventListener("click", async function() {
            btn.disabled = true;
            btn.textContent = "Estrazione in corso...";
            risultati.innerHTML = "";

            const dFrom = new Date().toISOString().split('T')[0];
            const dTo = new Date(Date.now() + 4 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            let listaPartite = [];

            for (let i = 0; i < CAMPIONATI.length; i++) {
                const cod = CAMPIONATI[i];
                stato.textContent = `Scansione: ${cod} (${i + 1}/${CAMPIONATI.length}) - Partite trovate finora: ${listaPartite.length}`;

                // 1. Prendi le partite del campionato
                const dataMatches = await fetchAPI(`competitions/${cod}/matches?dateFrom=${dFrom}&dateTo=${dTo}`);
                await delay(300);

                if (dataMatches && dataMatches.matches) {
                    const matches = dataMatches.matches.filter(m => {
                        const st = (m.status || "").toUpperCase();
                        return st === "TIMED" || st === "SCHEDULED";
                    });

                    if (matches.length > 0) {
                        // 2. Prendi la classifica solo se sono presenti partite in programma
                        const dataStandings = await fetchAPI(`competitions/${cod}/standings`);
                        await delay(300);

                        let mappaClassifica = {};
                        if (dataStandings && dataStandings.standings && dataStandings.standings[0]) {
                            (dataStandings.standings[0].table || []).forEach(row => {
                                mappaClassifica[row.team.id] = {
                                    pos: row.position,
                                    pts: row.points,
                                    pg: row.playedGames,
                                    gf: row.goalsFor,
                                    gs: row.goalsAgainst
                                };
                            });
                        }

                        matches.forEach(m => {
                            const c = mappaClassifica[m.homeTeam.id] || {};
                            const o = mappaClassifica[m.awayTeam.id] || {};

                            listaPartite.push({
                                campionato: m.competition ? m.competition.name : cod,
                                squadraCasa: m.homeTeam.name,
                                squadraOspite: m.awayTeam.name,
                                dataOraUTC: m.utcDate,
                                puntiCasa: c.pts ?? "-",
                                puntiOspite: o.pts ?? "-",
                                posizioneCasa: c.pos ? c.pos + "°" : "-",
                                posizioneOspite: o.pos ? o.pos + "°" : "-",
                                giocateCasa: c.pg ?? "-",
                                giocateOspite: o.pg ?? "-",
                                golFattiCasa: c.gf ?? "-",
                                golFattiOspite: o.gf ?? "-",
                                golSubitiCasa: c.gs ?? "-",
                                golSubitiOspite: o.gs ?? "-"
                            });
                        });
                    }
                }
            }

            stato.textContent = "Estrazione completata. Trovate " + listaPartite.length + " partite.";
            mostraPartite(listaPartite);

            btn.disabled = false;
            btn.textContent = "Estrai Partite (prossimi 4 giorni)";
        });
    </script>
</body>
</html>
