<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Estrazione Palinsesto</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .box { margin-bottom: 15px; }
    input[type="number"] { width: 80px; padding: 5px; font-size: 16px; }
    button { padding: 7px 15px; font-size: 16px; cursor: pointer; }
    #status { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Estrazione Palinsesto Partite</h2>

  <div class="box">
    <!-- Campo per inserire i giorni (N) -->
    <label for="numGiorni"><strong>Numero di giorni da estrarre:</strong></label>
    <input type="number" id="numGiorni" value="7" min="1" max="30">
    
    <!-- Pulsante che attiva l'estrazione -->
    <button onclick="avviaEstrazione()">Estrai Partite</button>
  </div>

  <div id="status"></div>
  <pre id="risultato"></pre>

  <script>
    // Inserisci qui l'URL reale del tuo Cloudflare Worker
    const WORKER_URL = "https://tuo-worker.workers.dev";

    async function avviaEstrazione() {
      // 1. Legge il numero di giorni inserito dall'utente nell'input
      const giorni = document.getElementById("numGiorni").value;
      const statusDiv = document.getElementById("status");
      const risultatoPre = document.getElementById("risultato");

      if (!giorni || giorni <= 0) {
        alert("Inserisci un numero valido di giorni.");
        return;
      }

      statusDiv.innerHTML = `Estrazione in corso per i prossimi ${giorni} giorni... (può richiedere un po' di tempo)`;
      risultatoPre.textContent = "";

      try {
        // 2. Chiamata HTTP dinamica passando il parametro ?giorni=N
        const response = await fetch(`${WORKER_URL}/?giorni=${giorni}&force=true`);
        const data = await response.json();

        statusDiv.innerHTML = `Estrazione completata! Trovate ${data.totalePartiteTrovate} partite.`;
        risultatoPre.textContent = JSON.stringify(data, null, 2);

      } catch (error) {
        statusDiv.innerHTML = "Errore durante l'estrazione.";
        risultatoPre.textContent = error.message;
      }
    }
  </script>

</body>
</html>
